<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR del menú | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head><body class="bg-slate-100 min-h-screen p-4"><div class="no-print max-w-xl mx-auto flex justify-between items-center mb-4"><a href="admin.html" class="font-black text-orange-600">← Volver</a><button onclick="window.print()" class="px-5 py-3 rounded-xl bg-slate-900 text-white font-black">IMPRIMIR</button></div><main class="qr-sheet bg-white max-w-xl mx-auto min-h-[720px] p-10 flex flex-col items-center justify-center text-center"><img id="brand-logo" src="logo.png" class="w-24 h-24 object-cover rounded-3xl mb-6"><p class="text-sm font-black text-orange-500 tracking-[.25em] uppercase">Nuestro menú</p><h1 id="restaurant-name" class="text-4xl font-black mt-3">ServeYourself</h1><div id="qrcode" class="my-10 p-4 bg-white border-4 border-slate-950 rounded-2xl"></div><p class="text-xl font-black">Escanea para consultar el menú</p><p class="text-sm text-slate-500 mt-3">No necesitas descargar ninguna aplicación.</p><p id="menu-url" class="text-xs text-slate-400 mt-8 break-all"></p></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script><script>
async function init(){const access=await window.serveYourself.requireRestaurantAccess(['owner']);if(!access)return;const db=window.serveYourself.supabase;document.getElementById('restaurant-name').textContent=access.business_name;const{data}=await db.from('public_qr_restaurants').select('avatar_url').eq('id',access.restaurant_id).single();document.getElementById('brand-logo').src=window.serveYourself.safeImageUrl(data?.avatar_url)||'logo.png';const url=`${location.origin}${location.pathname.replace(/qr\.html$/,'menu-publico.html')}?id=${encodeURIComponent(access.restaurant_id)}`;document.getElementById('menu-url').textContent=url;new QRCode(document.getElementById('qrcode'),{text:url,width:260,height:260,colorDark:'#0f172a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});}init();
</script></body></html>
