<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menú | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head>
<body class="bg-slate-50 min-h-screen"><header id="hero" class="bg-slate-950 text-white"><div class="max-w-3xl mx-auto p-7 text-center"><img id="restaurant-logo" src="logo.png" class="w-20 h-20 rounded-3xl object-cover bg-white mx-auto"><p class="text-xs text-orange-400 font-black tracking-widest uppercase mt-4">Menú</p><h1 id="restaurant-name" class="text-3xl font-black mt-1">Cargando...</h1><p id="restaurant-info" class="text-sm text-slate-400 mt-2"></p></div></header><main class="max-w-3xl mx-auto p-4"><div id="menu-content" class="space-y-8"></div><footer class="text-center text-xs text-slate-400 py-10">Menú digital creado con <b>ServeYourself</b></footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml,safe=window.serveYourself.safeImageUrl;async function init(){const id=new URLSearchParams(location.search).get('id');if(!id)return showError('Este enlace no contiene un restaurante.');const[{data:restaurant,error:rError},{data:products,error:pError}]=await Promise.all([db.from('public_qr_restaurants').select('*').eq('id',id).single(),db.from('public_qr_products').select('*').eq('restaurant_id',id).order('category').order('name')]);if(rError||!restaurant)return showError('Este menú no está disponible.');document.title=`Menú de ${restaurant.business_name}`;document.getElementById('restaurant-name').textContent=restaurant.business_name;document.getElementById('restaurant-logo').src=safe(restaurant.avatar_url)||'logo.png';const hours=restaurant.open_time&&restaurant.close_time?`Horario ${String(restaurant.open_time).slice(0,5)}–${String(restaurant.close_time).slice(0,5)}`:'';document.getElementById('restaurant-info').textContent=[restaurant.address,hours].filter(Boolean).join(' · ');if(pError)return showError('No se pudo cargar el menú.');const categories=[...new Set((products||[]).map(p=>p.category))];document.getElementById('menu-content').innerHTML=categories.length?categories.map(category=>`<section><h2 class="text-xl font-black mb-3">${esc(category)}</h2><div class="grid sm:grid-cols-2 gap-3">${products.filter(p=>p.category===category).map(p=>`<article class="bg-white p-3 rounded-2xl border border-slate-200 flex gap-3"><img src="${esc(safe(p.image_url)||'logo.png')}" class="w-20 h-20 object-cover rounded-xl bg-slate-100"><div class="flex-1"><h3 class="font-black">${esc(p.name)}</h3><p class="text-orange-500 font-black mt-2">$${Number(p.price).toFixed(2)}</p></div></article>`).join('')}</div></section>`).join(''):'<p class="text-center text-slate-400 py-16">No hay productos disponibles por ahora.</p>';}
function showError(message){document.getElementById('restaurant-name').textContent='Menú no disponible';document.getElementById('menu-content').innerHTML=`<p class="text-center text-slate-500 py-16">${esc(message)}</p>`;}init();
</script></body></html>
