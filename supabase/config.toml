project_id = "serveyourself"

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://127.0.0.1:8080/**"]

[functions.create-mercado-pago-preference]
# Authentication is checked in the handler (user JWT or private guest capability).
verify_jwt = false

[functions.mercado-pago-webhook]
verify_jwt = false

[functions.send-order-notification]
# Only random, server-created event IDs can claim a delivery.
verify_jwt = false

[functions.mercado-pago-connect-url]
verify_jwt = true

[functions.mercado-pago-oauth-callback]
verify_jwt = false

[functions.mercado-pago-disconnect]
verify_jwt = true

[functions.refund-mercado-pago-payment]
verify_jwt = true

[functions.guest-pickup]
verify_jwt = false
