name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: spbgledcjwtqmlqdlpyx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy authenticated functions
        run: |
          supabase functions deploy create-mercado-pago-preference --project-ref "$PROJECT_REF"
          supabase functions deploy send-order-notification --project-ref "$PROJECT_REF"
          supabase functions deploy mercado-pago-connect-url --project-ref "$PROJECT_REF"
          supabase functions deploy mercado-pago-disconnect --project-ref "$PROJECT_REF"

      - name: Deploy public callbacks
        run: |
          supabase functions deploy mercado-pago-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy mercado-pago-oauth-callback --project-ref "$PROJECT_REF" --no-verify-jwt
