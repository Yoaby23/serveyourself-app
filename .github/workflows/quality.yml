name: Calidad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de flujos y calidad
        run: node --test tests/*.test.mjs
      - name: Validar espacios y marcadores de conflicto
        run: git diff --check && ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)'
