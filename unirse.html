<!DOCTYPE html><html lang="es"><head><script src="theme.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Serveyouself</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="tailwind.generated.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"></head><body class="bg-slate-50 min-h-screen flex items-center justify-center p-5"><main class="bg-white border border-slate-200 rounded-[2rem] p-7 w-full max-w-md shadow-xl"><a data-sy-back href="index.html" class="text-orange-500 font-black">← Volver</a><h1 class="text-3xl font-black mt-6">Unirme al equipo</h1><p class="text-slate-500 mt-2">Inicia sesión con tu cuenta y escribe el código que te dio el restaurante.</p><form id="join-form" class="mt-7 space-y-4"><input type="text" id="join-code" required maxlength="8" autocomplete="one-time-code" placeholder="CÓDIGO" class="w-full p-5 rounded-2xl border border-slate-200 text-center uppercase tracking-[.3em] text-xl font-black"><button type="submit" class="w-full p-4 rounded-2xl bg-orange-500 text-white font-black">UNIRME</button></form><p id="session-help" class="text-sm text-slate-400 mt-5"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="app-config.js"></script><script src="business-image.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase;let user;async function init(){const{data:{user:sessionUser}}=await db.auth.getUser();user=sessionUser;if(!user){location.replace('index.html?next=unirse.html');return;}document.getElementById('session-help').textContent=`Sesión iniciada como ${user.email}`;}document.getElementById('join-form').addEventListener('submit',async e=>{e.preventDefault();if(!user)return;const{data,error}=await db.rpc('accept_staff_invite',{p_code:document.getElementById('join-code').value});if(error)return alert(error.message);alert(`Ya eres parte de ${data.business_name}.`);if(data.staff_role==='driver'){location.href='repartidor.html';return;}const access=await window.serveYourself.getRestaurantAccess();location.href=window.serveYourself.restaurantHome(access);});init();
</script></body></html>
