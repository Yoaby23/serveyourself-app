<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitar factura | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head><body class="bg-slate-50 min-h-screen"><header class="bg-white border-b"><div class="max-w-xl mx-auto p-4 flex justify-between items-center"><div><p class="text-xs font-black text-orange-500 uppercase">Facturación</p><h1 class="text-xl font-black">Solicitar factura</h1></div><a href="menu.html" class="px-4 py-3 rounded-xl bg-slate-900 text-white font-black">← Volver</a></div></header><main class="max-w-xl mx-auto p-4"><section class="bg-white border rounded-3xl p-6"><p class="text-sm text-slate-500">Captura los datos fiscales de una compra pagada. El restaurante recibirá la solicitud para procesarla con su proveedor de CFDI.</p><form id="invoice-form" class="space-y-3 mt-5"><label class="block text-xs font-black uppercase">Pedido<select id="order-id" required class="block w-full mt-1 p-3 border rounded-xl normal-case"></select></label><input id="rfc" required maxlength="13" placeholder="RFC" class="w-full p-3 border rounded-xl uppercase"><input id="legal-name" required maxlength="200" placeholder="Razón social" class="w-full p-3 border rounded-xl"><div class="grid grid-cols-2 gap-3"><input id="tax-regime" required placeholder="Régimen fiscal" class="p-3 border rounded-xl"><input id="cfdi-use" required placeholder="Uso CFDI" class="p-3 border rounded-xl"><input id="postal-code" required maxlength="5" pattern="[0-9]{5}" placeholder="Código postal" class="p-3 border rounded-xl"><input id="invoice-email" required type="email" placeholder="Correo" class="p-3 border rounded-xl"></div><button class="w-full py-4 rounded-xl bg-orange-500 text-white font-black">ENVIAR SOLICITUD</button></form><div id="status" class="mt-5"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;let user,orders=[];async function init(){user=await window.serveYourself.requireUser();if(!user)return;document.getElementById('invoice-email').value=user.email||'';const{data,error}=await db.from('orders').select('id,restaurant_id,restaurant_name,total,created_at,payment_status').eq('customer_id',user.id).eq('payment_status','approved').order('created_at',{ascending:false});if(error)return alert(error.message);orders=data||[];document.getElementById('order-id').innerHTML=orders.map(o=>`<option value="${o.id}">#${o.id} · ${esc(o.restaurant_name)} · $${Number(o.total).toFixed(2)}</option>`).join('')||'<option value="">No hay compras facturables</option>';}
document.getElementById('invoice-form').addEventListener('submit',async e=>{e.preventDefault();const order=orders.find(o=>o.id===Number(document.getElementById('order-id').value));if(!order)return alert('Selecciona una compra pagada.');const{error}=await db.from('invoice_requests').insert({restaurant_id:order.restaurant_id,order_id:order.id,requested_by:user.id,rfc:document.getElementById('rfc').value.trim().toUpperCase(),legal_name:document.getElementById('legal-name').value.trim(),tax_regime:document.getElementById('tax-regime').value.trim(),cfdi_use:document.getElementById('cfdi-use').value.trim(),postal_code:document.getElementById('postal-code').value.trim(),email:document.getElementById('invoice-email').value.trim()});if(error)return alert(error.message);e.target.querySelector('button').disabled=true;document.getElementById('status').innerHTML='<p class="p-4 rounded-xl bg-green-50 text-green-700 font-black">Solicitud enviada al restaurante.</p>';});init();
</script></body></html>
