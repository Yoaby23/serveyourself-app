<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina | ServeYourself</title><link rel="icon" href="logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-white min-h-screen kitchen-screen">
    <header class="kitchen-header sticky top-0 z-30 bg-slate-950/95 border-b border-slate-800 px-4 py-3">
        <div class="kitchen-identity"><p class="text-xs font-black text-orange-400 uppercase tracking-widest">Pantalla de cocina</p><h1 id="restaurant-name" class="text-xl font-black">ServeYourself</h1></div>
        <div class="kitchen-toolbar"><select id="station-filter" class="px-3 py-3 rounded-xl bg-slate-800 text-white font-black text-sm"><option value="all">Todas las estaciones</option><option value="general">General</option></select><button onclick="toggleAvailability()" class="px-3 py-3 rounded-xl bg-slate-800 font-black text-sm">Disponibilidad</button><button id="sound-button" class="px-3 py-3 rounded-xl bg-slate-800 font-black text-sm">🔇 Activar sonido</button></div>
        <div id="restaurant-nav" class="sy-restaurant-nav kitchen-navigation"></div>
    </header>
    <main class="p-3 grid lg:grid-cols-2 gap-3 min-h-[calc(100vh-76px)]">
        <section class="kitchen-column"><div class="kitchen-heading bg-orange-500"><span>Nuevos</span><b id="count-pendiente">0</b></div><div id="orders-pendiente" class="kitchen-list"></div></section>
        <section class="kitchen-column"><div class="kitchen-heading bg-blue-600"><span>Preparando</span><b id="count-preparando">0</b></div><div id="orders-preparando" class="kitchen-list"></div></section>
    </main>
    <audio id="new-order-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
    <aside id="availability-panel" class="hidden fixed inset-y-0 right-0 z-50 w-full max-w-sm bg-white text-slate-950 shadow-2xl p-5 overflow-y-auto"><div class="flex justify-between"><div><p class="text-xs font-black uppercase text-orange-500">Menú del turno</p><h2 class="text-xl font-black">Disponibilidad</h2></div><button onclick="toggleAvailability()" class="w-10 h-10 rounded-xl bg-slate-100 font-black">×</button></div><div id="availability-list" class="mt-5 space-y-2"></div></aside>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script>
    <script>
        const db = window.serveYourself.supabase, esc = window.serveYourself.escapeHtml;
        let access, orders = [], stations = [], products = [], tables = [], activeStation = 'all', soundEnabled = false, timer, syncTimer, loadingOrders = false;
        const nextStatus = { pendiente: ['preparando', 'COMENZAR'], preparando: ['listo', 'MARCAR LISTO'], listo: ['entregado', 'ENTREGAR'] };
        async function init() {
            access = await window.serveYourself.requireRestaurantPermission('can_view_kitchen'); if (!access) return;
            document.getElementById('restaurant-name').textContent = access.business_name;
            window.serveYourself.renderRestaurantNavigation(access, { dark: true });
            window.serveYourself.initPushNotifications(access.user);
            const [{ data: stationData }, { data: productData }, { data: tableData }] = await Promise.all([db.from('kitchen_stations').select('*').eq('restaurant_id',access.restaurant_id).eq('is_active',true).order('name'),db.from('products').select('id,name,kitchen_station_id,is_available').eq('restaurant_id',access.restaurant_id).order('name'),db.from('restaurant_tables').select('id,name').eq('restaurant_id',access.restaurant_id)]);
            stations=stationData||[];products=productData||[];tables=tableData||[];document.getElementById('station-filter').innerHTML += stations.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');renderAvailability();
            await loadOrders();
            db.channel(`kitchen-${access.restaurant_id}`).on('postgres_changes', { event: '*', schema: 'public', table: 'kitchen_tickets', filter: `restaurant_id=eq.${access.restaurant_id}` }, payload => {
                if (soundEnabled && payload.eventType === 'INSERT') document.getElementById('new-order-sound').play().catch(() => {});
                loadOrders();
            }).subscribe(status => {
                if (status === 'SUBSCRIBED') loadOrders();
            });
            timer = setInterval(render, 30000);
            syncTimer = setInterval(() => {
                if (document.visibilityState === 'visible') loadOrders();
            }, 5000);
        }
        async function loadOrders() {
            if (!access || loadingOrders) return;
            loadingOrders = true;
            const { data, error } = await db.from('kitchen_tickets').select('*, kitchen_ticket_station_statuses(*)').eq('restaurant_id', access.restaurant_id).in('status', ['pendiente', 'preparando', 'listo']).order('created_at');
            loadingOrders = false;
            if (error) return console.warn('No se pudieron sincronizar los pedidos:', error.message);
            orders = data || []; render();
        }
        function elapsed(date) {
            const minutes = Math.max(0, Math.floor((Date.now() - new Date(date).getTime()) / 60000));
            if (minutes < 1) return 'ahora'; if (minutes < 60) return `${minutes} min`; return `${Math.floor(minutes / 60)} h ${minutes % 60} min`;
        }
        function orderCard(order) {
            const stationState = activeStation === 'all' ? order.status : (order.kitchen_ticket_station_statuses?.find(s=>s.station_key===activeStation)?.status || order.status);
            const [status, label] = nextStatus[stationState];
            const location = order.service_type === 'dine_in' ? (tables.find(table=>Number(table.id)===Number(order.table_id))?.name || 'Mesa') : 'Para llevar';
            const roundItems = order.items;
            const visibleItems = activeStation === 'all' ? roundItems : roundItems.filter(item => String(item.station_id || products.find(p=>p.id===item.id)?.kitchen_station_id || 'general') === activeStation);
            return `<article class="kitchen-card ${elapsed(order.created_at).includes(' h') ? 'kitchen-late' : ''}">
                <div class="flex items-start justify-between gap-3"><div><p class="text-2xl font-black">Comanda #${order.id}</p><p class="text-xs text-slate-400">Cuenta #${order.order_id}</p><p class="text-sm font-black text-orange-400 mt-1">${esc(location)}</p></div><div class="text-right"><p class="kitchen-clock">${elapsed(order.created_at)}</p><p class="text-xs text-slate-400 mt-1">${new Date(order.created_at).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'})}</p></div></div>
                <div class="my-4 space-y-2">${visibleItems.map(item => `<div class="flex gap-3 text-lg font-extrabold"><span class="text-orange-400 min-w-8">${Number(item.qty)}×</span><span>${esc(item.nombre)}</span></div>`).join('')}</div>
                ${order.notes ? `<div class="bg-amber-300 text-slate-950 p-3 rounded-xl font-black">📝 ${esc(order.notes)}</div>` : ''}
                ${order.waiter_name ? `<p class="text-xs text-slate-400 mt-3">Mesero: ${esc(order.waiter_name)}</p>` : ''}
                <button onclick="moveOrder(${order.id}, '${status}')" class="w-full mt-4 py-4 rounded-xl ${stationState === 'listo' ? 'bg-emerald-500' : 'bg-white text-slate-950'} font-black text-base">${label}</button>
            </article>`;
        }
        function render() {
            ['pendiente','preparando'].forEach(status => {
                const list = orders.filter(o => { const state=activeStation==='all'?o.status:(o.kitchen_ticket_station_statuses?.find(s=>s.station_key===activeStation)?.status);const hasItems=activeStation==='all'||o.items.some(item=>String(item.station_id||products.find(p=>p.id===item.id)?.kitchen_station_id||'general')===activeStation);return state===status&&hasItems; });
                document.getElementById(`count-${status}`).textContent = list.length;
                document.getElementById(`orders-${status}`).innerHTML = list.length ? list.map(orderCard).join('') : '<p class="text-center text-slate-600 py-12 font-bold">Sin pedidos</p>';
            });
        }
        async function moveOrder(id, status) {
            const { error } = activeStation === 'all' ? await db.rpc('update_kitchen_ticket_status', { p_ticket_id: id, p_status: status }) : await db.rpc('update_kitchen_ticket_station_status',{p_ticket_id:id,p_station_key:activeStation,p_status:status});
            if (error) return alert(error.message);
            await loadOrders();
            const { error: notificationError } = await db.functions.invoke('send-order-notification', { body: { ticketId: id } });
            if (notificationError) console.warn('No se pudo enviar la notificación push:', notificationError.message);
        }
        document.getElementById('sound-button').addEventListener('click', () => { soundEnabled = !soundEnabled; document.getElementById('sound-button').textContent = soundEnabled ? '🔊 Sonido activo' : '🔇 Activar sonido'; if (soundEnabled) document.getElementById('new-order-sound').play().then(a => { a.pause(); a.currentTime = 0; }).catch(() => {}); });
        document.getElementById('station-filter').addEventListener('change',e=>{activeStation=e.target.value;render();});
        function toggleAvailability(){document.getElementById('availability-panel').classList.toggle('hidden');}
        function renderAvailability(){document.getElementById('availability-list').innerHTML=products.map(p=>`<div class="flex justify-between items-center p-3 rounded-xl ${p.is_available?'bg-slate-50':'bg-red-50'}"><b>${esc(p.name)}</b><button onclick="setAvailability('${p.id}',${!p.is_available})" class="text-xs font-black ${p.is_available?'text-red-500':'text-green-600'}">${p.is_available?'AGOTAR':'REACTIVAR'}</button></div>`).join('');}
        async function setAvailability(id,value){const{error}=await db.rpc('set_product_availability',{p_product_id:id,p_available:value});if(error)return alert(error.message);const p=products.find(x=>x.id===id);if(p)p.is_available=value;renderAvailability();}
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadOrders(); });
        window.addEventListener('pageshow', loadOrders);
        window.addEventListener('online', loadOrders);
        window.addEventListener('focus', loadOrders);
        init();
    </script>
</body>
</html>
