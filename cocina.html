<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina | ServeYourself</title><link rel="icon" href="logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-white min-h-screen kitchen-screen">
    <header class="sticky top-0 z-30 bg-slate-950/95 border-b border-slate-800 px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div><p class="text-xs font-black text-orange-400 uppercase tracking-widest">Pantalla de cocina</p><h1 id="restaurant-name" class="text-xl font-black">ServeYourself</h1></div>
        <div class="flex flex-wrap gap-2"><button id="sound-button" class="px-3 py-3 rounded-xl bg-slate-800 font-black text-sm">🔇 Activar sonido</button><a href="menu.html" class="px-3 py-3 rounded-xl bg-blue-600 text-white font-black text-sm">Mis pedidos</a><a id="pos-link" href="pos.html" class="px-3 py-3 rounded-xl bg-orange-500 text-white font-black text-sm">POS</a><a id="admin-link" href="admin.html" class="px-3 py-3 rounded-xl bg-white text-slate-950 font-black text-sm">Panel</a></div>
    </header>
    <main class="p-3 grid xl:grid-cols-3 gap-3 min-h-[calc(100vh-76px)]">
        <section class="kitchen-column"><div class="kitchen-heading bg-orange-500"><span>Nuevos</span><b id="count-pendiente">0</b></div><div id="orders-pendiente" class="kitchen-list"></div></section>
        <section class="kitchen-column"><div class="kitchen-heading bg-blue-600"><span>Preparando</span><b id="count-preparando">0</b></div><div id="orders-preparando" class="kitchen-list"></div></section>
        <section class="kitchen-column"><div class="kitchen-heading bg-emerald-600"><span>Listos</span><b id="count-listo">0</b></div><div id="orders-listo" class="kitchen-list"></div></section>
    </main>
    <audio id="new-order-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script>
    <script>
        const db = window.serveYourself.supabase, esc = window.serveYourself.escapeHtml;
        let access, orders = [], soundEnabled = false, timer;
        const nextStatus = { pendiente: ['preparando', 'COMENZAR'], preparando: ['listo', 'MARCAR LISTO'], listo: ['entregado', 'ENTREGAR'] };
        async function init() {
            access = await window.serveYourself.requireRestaurantPermission('can_view_kitchen'); if (!access) return;
            document.getElementById('restaurant-name').textContent = access.business_name;
            document.getElementById('admin-link').classList.toggle('hidden', access.staff_role !== 'owner');
            document.getElementById('pos-link').classList.toggle('hidden', !access.can_create_orders && !access.can_close_accounts);
            await loadOrders();
            db.channel(`kitchen-${access.restaurant_id}`).on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: `restaurant_id=eq.${access.restaurant_id}` }, payload => {
                if (payload.eventType === 'INSERT' && soundEnabled) document.getElementById('new-order-sound').play().catch(() => {});
                loadOrders();
            }).subscribe();
            timer = setInterval(render, 30000);
        }
        async function loadOrders() {
            const { data, error } = await db.from('orders').select('*, restaurant_tables(name)').eq('restaurant_id', access.restaurant_id).in('status', ['pendiente', 'preparando', 'listo']).order('created_at');
            if (error) return alert('No se pudieron cargar los pedidos: ' + error.message);
            orders = data || []; render();
        }
        function elapsed(date) {
            const minutes = Math.max(0, Math.floor((Date.now() - new Date(date).getTime()) / 60000));
            if (minutes < 1) return 'ahora'; if (minutes < 60) return `${minutes} min`; return `${Math.floor(minutes / 60)} h ${minutes % 60} min`;
        }
        function orderCard(order) {
            const [status, label] = nextStatus[order.status];
            const paymentBlocked = order.payment_method === 'mercado_pago' && order.payment_status !== 'approved';
            const location = order.service_type === 'dine_in' ? (order.restaurant_tables?.name || 'Mesa') : 'Para llevar';
            return `<article class="kitchen-card ${elapsed(order.created_at).includes(' h') ? 'kitchen-late' : ''}">
                <div class="flex items-start justify-between gap-3"><div><p class="text-2xl font-black">#${order.id}</p><p class="text-sm font-black text-orange-400 mt-1">${esc(location)}</p></div><div class="text-right"><p class="kitchen-clock">${elapsed(order.created_at)}</p><p class="text-xs text-slate-400 mt-1">${new Date(order.created_at).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'})}</p></div></div>
                <div class="my-4 space-y-2">${order.items.map(item => `<div class="flex gap-3 text-lg font-extrabold"><span class="text-orange-400 min-w-8">${Number(item.qty)}×</span><span>${esc(item.nombre)}</span></div>`).join('')}</div>
                ${order.notes ? `<div class="bg-amber-300 text-slate-950 p-3 rounded-xl font-black">📝 ${esc(order.notes)}</div>` : ''}
                ${order.waiter_name ? `<p class="text-xs text-slate-400 mt-3">Mesero: ${esc(order.waiter_name)}</p>` : ''}
                ${paymentBlocked ? '<p class="mt-4 p-3 rounded-xl bg-red-500/20 text-red-300 font-black">Esperando pago en línea</p>' : `<button onclick="moveOrder(${order.id}, '${status}')" class="w-full mt-4 py-4 rounded-xl ${order.status === 'listo' ? 'bg-emerald-500' : 'bg-white text-slate-950'} font-black text-base">${label}</button>`}
            </article>`;
        }
        function render() {
            ['pendiente','preparando','listo'].forEach(status => {
                const list = orders.filter(o => o.status === status);
                document.getElementById(`count-${status}`).textContent = list.length;
                document.getElementById(`orders-${status}`).innerHTML = list.length ? list.map(orderCard).join('') : '<p class="text-center text-slate-600 py-12 font-bold">Sin pedidos</p>';
            });
        }
        async function moveOrder(id, status) {
            const { error } = await db.rpc('update_kitchen_order_status', { p_order_id: id, p_status: status });
            if (error) return alert(error.message);
            const order = orders.find(o => o.id === id); if (order) order.status = status; render();
            db.functions.invoke('send-order-notification', { body: { orderId: id } });
        }
        document.getElementById('sound-button').addEventListener('click', () => { soundEnabled = !soundEnabled; document.getElementById('sound-button').textContent = soundEnabled ? '🔊 Sonido activo' : '🔇 Activar sonido'; if (soundEnabled) document.getElementById('new-order-sound').play().then(a => { a.pause(); a.currentTime = 0; }).catch(() => {}); });
        init();
    </script>
</body>
</html>
