<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Serveyouself</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="tailwind.generated.css"><link rel="stylesheet" href="styles.css"></head>
<body class="bg-slate-50 min-h-screen"><header class="bg-white border-b"><div class="max-w-3xl mx-auto p-4 flex items-center justify-between"><div><p class="text-xs font-black text-orange-500">PLATAFORMA</p><h1 class="text-xl font-black">Alta de repartidores</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></div></header><main class="max-w-3xl mx-auto p-4"><section class="bg-white border rounded-3xl p-5"><p class="text-slate-500 text-sm">Revisa los datos antes de habilitar una cuenta. Caja asigna las entregas a los repartidores que el restaurante ha integrado a su equipo.</p><p id="platform-status" role="status" aria-live="polite"></p><button type="button" id="platform-retry" hidden onclick="init()" class="sy-config-secondary">Reintentar</button><div id="drivers" class="grid gap-3 mt-5"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;async function init(){
 const app=window.serveYourself,status=document.getElementById('platform-status'),retry=document.getElementById('platform-retry');
 status.textContent='Verificando acceso…';retry.hidden=true;
 try{
  const user=await app.requireUser();if(!user)return;
  const access=await app.getRestaurantAccess();
  const {data:allowed,error}=await db.rpc('is_platform_admin');if(error)throw error;
  if(allowed!==true){location.replace(app.restaurantHome(access));return;}
  if(access)app.renderRestaurantNavigation(access);
  else app.renderBottomNavigation([{href:'platform-admin.html',label:'Plataforma',icon:'people'},{href:'menu.html',label:'Inicio',icon:'home'},{href:'cuenta.html',label:'Cuenta',icon:'account'}]);
  status.textContent='';await load();
 }catch(error){status.textContent='No se pudo comprobar el acceso. Reintenta sin salir de tu cuenta.';retry.hidden=false;}
}async function load(){const{data,error}=await db.rpc('list_pending_delivery_drivers');if(error)return alert(error.message);drivers.innerHTML=data?.length?data.map(d=>`<article class="p-4 border rounded-2xl bg-slate-50"><div class="flex items-start justify-between gap-3"><div><b class="text-lg">${esc(d.full_name)}</b><p class="text-sm text-slate-500">${esc(d.phone)} · ${esc(d.vehicle_type)}${d.vehicle_plate?` · ${esc(d.vehicle_plate)}`:''}</p></div><span class="text-xs font-black text-orange-600">EN REVISIÓN</span></div><div class="grid grid-cols-2 gap-2 mt-4"><button type="button" onclick="review('${d.user_id}',true)" class="py-3 rounded-xl bg-green-600 text-white font-black">APROBAR</button><button type="button" onclick="review('${d.user_id}',false)" class="py-3 rounded-xl bg-red-50 text-red-600 font-black">RECHAZAR</button></div></article>`).join(''):'<p class="py-10 text-center text-slate-400">No hay registros pendientes.</p>'}async function review(id,approve){if(!confirm(approve?'¿Aprobar este repartidor?':'¿Rechazar este registro?'))return;const{error}=await db.rpc('review_delivery_driver',{p_driver_id:id,p_approve:approve});if(error)return alert(error.message);load()}init();
</script></body></html>
