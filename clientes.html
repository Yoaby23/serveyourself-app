<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes y promociones | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head><body class="bg-slate-50 min-h-screen"><header class="bg-white border-b sticky top-0 z-30"><div class="max-w-6xl mx-auto p-4 flex justify-between items-center"><div><p class="text-xs font-black text-purple-600 uppercase tracking-widest">Crecimiento</p><h1 class="text-xl font-black">Clientes y promociones</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></div></header><main class="max-w-6xl mx-auto p-4 grid lg:grid-cols-2 gap-5">
<section class="bg-white border rounded-3xl p-5"><h2 class="text-xl font-black">Cupones</h2><form id="coupon-form" class="grid grid-cols-2 gap-2 mt-4"><input id="coupon-code" required maxlength="30" placeholder="Código" class="col-span-2 p-3 border rounded-xl uppercase"><select id="coupon-type" class="p-3 border rounded-xl"><option value="percent">Porcentaje</option><option value="fixed">Monto fijo</option></select><input id="coupon-value" required type="number" min="0.01" step="0.01" placeholder="Valor" class="p-3 border rounded-xl"><input id="coupon-start" type="datetime-local" class="p-3 border rounded-xl"><input id="coupon-end" type="datetime-local" class="p-3 border rounded-xl"><button class="col-span-2 py-3 rounded-xl bg-purple-600 text-white font-black">CREAR CUPÓN</button></form><div id="coupon-list" class="mt-4 space-y-2"></div></section>
<section class="bg-white border rounded-3xl p-5"><h2 class="text-xl font-black">Reservaciones</h2><form id="reservation-form" class="grid grid-cols-2 gap-2 mt-4"><input id="reservation-name" required placeholder="Nombre" class="p-3 border rounded-xl"><input id="reservation-phone" required placeholder="Teléfono" class="p-3 border rounded-xl"><input id="reservation-size" required type="number" min="1" max="100" value="2" class="p-3 border rounded-xl"><input id="reservation-date" required type="datetime-local" class="p-3 border rounded-xl"><textarea id="reservation-notes" placeholder="Notas" class="col-span-2 p-3 border rounded-xl"></textarea><button class="col-span-2 py-3 rounded-xl bg-slate-900 text-white font-black">AGENDAR</button></form><div id="reservation-list" class="mt-4 space-y-2"></div></section>
<section class="bg-white border rounded-3xl p-5"><h2 class="text-xl font-black">Clientes frecuentes</h2><form id="loyalty-form" class="grid grid-cols-2 gap-2 mt-4"><input id="loyalty-name" required placeholder="Nombre" class="p-3 border rounded-xl"><input id="loyalty-phone" required placeholder="Teléfono" class="p-3 border rounded-xl"><button class="col-span-2 py-3 rounded-xl bg-emerald-600 text-white font-black">REGISTRAR CLIENTE</button></form><div id="loyalty-list" class="mt-4 space-y-2"></div></section>
<section class="bg-white border rounded-3xl p-5"><h2 class="text-xl font-black">Solicitudes de factura</h2><p class="text-sm text-slate-500">Bandeja preparada para conectar posteriormente un PAC de CFDI.</p><div id="invoice-list" class="mt-4 space-y-2"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;let access,coupons=[],reservations=[],customers=[],invoices=[];
async function init(){access=await window.serveYourself.requireRestaurantAccess(['owner']);if(!access)return;window.serveYourself.renderRestaurantNavigation(access);await loadAll();}
async function loadAll(){const[c,r,l,i]=await Promise.all([db.from('coupons').select('*').eq('restaurant_id',access.restaurant_id).order('created_at',{ascending:false}),db.from('reservations').select('*').eq('restaurant_id',access.restaurant_id).order('reserved_at'),db.from('loyalty_customers').select('*').eq('restaurant_id',access.restaurant_id).order('points',{ascending:false}),db.from('invoice_requests').select('*').eq('restaurant_id',access.restaurant_id).order('created_at',{ascending:false})]);if([c,r,l,i].some(x=>x.error))return alert('Aplica primero la migración 008 en Supabase.');coupons=c.data||[];reservations=r.data||[];customers=l.data||[];invoices=i.data||[];render();}
function render(){document.getElementById('coupon-list').innerHTML=coupons.map(c=>`<div class="flex justify-between p-3 bg-slate-50 rounded-xl"><span><b>${esc(c.code)}</b><small class="block text-slate-500">${c.discount_type==='percent'?c.discount_value+'%':'$'+Number(c.discount_value).toFixed(2)}</small></span><button onclick="toggleCoupon('${c.id}',${!c.is_active})" class="text-xs font-black ${c.is_active?'text-red-500':'text-green-600'}">${c.is_active?'DESACTIVAR':'ACTIVAR'}</button></div>`).join('')||empty();document.getElementById('reservation-list').innerHTML=reservations.map(r=>`<div class="p-3 bg-slate-50 rounded-xl"><div class="flex justify-between"><span><b>${esc(r.customer_name)}</b><small class="block text-slate-500">${new Date(r.reserved_at).toLocaleString('es-MX')} · ${r.party_size} personas · ${esc(r.phone)}</small></span><select onchange="reservationStatus('${r.id}',this.value)" class="p-2 border rounded-lg text-xs"><option value="pending" ${r.status==='pending'?'selected':''}>Pendiente</option><option value="confirmed" ${r.status==='confirmed'?'selected':''}>Confirmada</option><option value="seated" ${r.status==='seated'?'selected':''}>En mesa</option><option value="completed" ${r.status==='completed'?'selected':''}>Completada</option><option value="cancelled" ${r.status==='cancelled'?'selected':''}>Cancelada</option></select></div></div>`).join('')||empty();document.getElementById('loyalty-list').innerHTML=customers.map(c=>`<div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl"><span><b>${esc(c.customer_name)}</b><small class="block text-slate-500">${esc(c.phone)} · ${c.visits} visitas</small></span><div class="flex items-center gap-2"><button onclick="addPoints('${c.id}',-1)" class="w-8 h-8 bg-white rounded-lg">−</button><b>${c.points} pts</b><button onclick="addPoints('${c.id}',1)" class="w-8 h-8 bg-emerald-100 rounded-lg">+</button></div></div>`).join('')||empty();document.getElementById('invoice-list').innerHTML=invoices.map(i=>`<div class="p-3 bg-slate-50 rounded-xl"><div class="flex justify-between"><span><b>Pedido #${i.order_id} · ${esc(i.rfc)}</b><small class="block text-slate-500">${esc(i.legal_name)} · ${esc(i.email)}</small></span><select onchange="invoiceStatus('${i.id}',this.value)" class="p-2 border rounded-lg text-xs"><option value="pending" ${i.status==='pending'?'selected':''}>Pendiente</option><option value="issued" ${i.status==='issued'?'selected':''}>Emitida</option><option value="rejected" ${i.status==='rejected'?'selected':''}>Rechazada</option></select></div></div>`).join('')||empty();}function empty(){return '<p class="text-sm text-slate-400">Sin registros.</p>'}
document.getElementById('coupon-form').addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.from('coupons').insert({restaurant_id:access.restaurant_id,code:document.getElementById('coupon-code').value.trim().toUpperCase(),discount_type:document.getElementById('coupon-type').value,discount_value:Number(document.getElementById('coupon-value').value),starts_at:document.getElementById('coupon-start').value||null,ends_at:document.getElementById('coupon-end').value||null});if(error)return alert(error.message);e.target.reset();loadAll();});
document.getElementById('reservation-form').addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.from('reservations').insert({restaurant_id:access.restaurant_id,customer_name:document.getElementById('reservation-name').value.trim(),phone:document.getElementById('reservation-phone').value.trim(),party_size:Number(document.getElementById('reservation-size').value),reserved_at:document.getElementById('reservation-date').value,notes:document.getElementById('reservation-notes').value.trim()||null});if(error)return alert(error.message);e.target.reset();loadAll();});
document.getElementById('loyalty-form').addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.from('loyalty_customers').insert({restaurant_id:access.restaurant_id,customer_name:document.getElementById('loyalty-name').value.trim(),phone:document.getElementById('loyalty-phone').value.trim()});if(error)return alert(error.message);e.target.reset();loadAll();});
async function toggleCoupon(id,value){const{error}=await db.from('coupons').update({is_active:value}).eq('id',id);if(error)alert(error.message);else loadAll();}async function reservationStatus(id,status){const{error}=await db.from('reservations').update({status}).eq('id',id);if(error)alert(error.message);else loadAll();}async function addPoints(id,delta){const c=customers.find(x=>x.id===id),points=Math.max(0,c.points+delta);const{error}=await db.from('loyalty_customers').update({points,visits:delta>0?c.visits+1:c.visits,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadAll();}async function invoiceStatus(id,status){const{error}=await db.from('invoice_requests').update({status}).eq('id',id);if(error)alert(error.message);else loadAll();}init();
</script></body></html>
