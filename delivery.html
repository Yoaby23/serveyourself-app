<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Delivery y despacho | ServeYourself</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="tailwind.generated.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 min-h-screen">
  <header class="bg-white border-b sticky top-0 z-30"><div class="max-w-7xl mx-auto p-4 flex justify-between items-center"><div><p class="text-xs font-black text-orange-500 uppercase">Operación</p><h1 class="text-xl font-black">Delivery y despacho</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></div></header>
  <main class="max-w-7xl mx-auto p-4 space-y-5">
    <section id="metrics" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></section>
    <section class="bg-white border rounded-3xl p-4 flex flex-wrap gap-3 items-center"><span id="connection" class="px-3 py-2 rounded-xl bg-green-50 text-green-700 text-xs font-black">● EN TIEMPO REAL</span><button type="button" onclick="loadAll()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-black">ACTUALIZAR</button><span class="text-xs text-slate-500 font-bold">Los repartidores independientes aceptan las entregas publicadas.</span></section>
    <section class="grid md:grid-cols-2 xl:grid-cols-4 gap-4"><div class="bg-white border rounded-3xl p-4"><h2 class="font-black flex justify-between">Nuevos <span id="count-new">0</span></h2><div id="col-new" class="space-y-3 mt-4"></div></div><div class="bg-white border rounded-3xl p-4"><h2 class="font-black flex justify-between">En cocina <span id="count-kitchen">0</span></h2><div id="col-kitchen" class="space-y-3 mt-4"></div></div><div class="bg-white border rounded-3xl p-4"><h2 class="font-black flex justify-between">Listos para salir <span id="count-ready">0</span></h2><div id="col-ready" class="space-y-3 mt-4"></div></div><div class="bg-slate-900 text-white rounded-3xl p-4"><h2 class="font-black flex justify-between">En ruta <span id="count-route">0</span></h2><div id="col-route" class="space-y-3 mt-4"></div></div></section>
    <section class="bg-white border rounded-3xl p-5"><h2 class="font-black text-lg">Incidencias abiertas</h2><div id="incidents" class="grid md:grid-cols-2 gap-3 mt-4"></div></section>
    <section class="bg-white border rounded-3xl p-5"><div class="flex flex-wrap items-end justify-between gap-2"><div><p class="text-xs font-black text-orange-500 uppercase">Control de efectivo</p><h2 class="font-black text-lg">Liquidaciones de repartidores</h2></div><button type="button" onclick="loadAll()" class="px-4 py-2 rounded-xl bg-slate-100 text-xs font-black">ACTUALIZAR SALDOS</button></div><div id="settlements" class="grid md:grid-cols-2 gap-3 mt-4"></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="app-config.js"></script><script src="app.js"></script>
  <script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml,money=n=>`$${Number(n||0).toFixed(2)}`;
let access,orders=[],balances=[];
const payments={cash:'Efectivo al entregar',mercado_pago:'Mercado Pago'};
async function init(){access=await window.serveYourself.requireRestaurantPermission('can_manage_delivery');if(!access)return;window.serveYourself.renderRestaurantNavigation(access,{showBack:false});await loadAll();db.channel(`delivery-${access.restaurant_id}`).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:`restaurant_id=eq.${access.restaurant_id}`},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'delivery_events',filter:`restaurant_id=eq.${access.restaurant_id}`},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'delivery_incidents',filter:`restaurant_id=eq.${access.restaurant_id}`},loadAll).subscribe(s=>connection.textContent=s==='SUBSCRIBED'?'● EN TIEMPO REAL':'○ RECONECTANDO');setInterval(()=>{if(!document.hidden)loadAll()},15000)}
async function loadAll(){const[o,i,b]=await Promise.all([db.from('orders').select('*').eq('restaurant_id',access.restaurant_id).eq('service_type','delivery').not('delivery_status','in','(delivered,cancelled)').order('created_at'),db.from('delivery_incidents').select('*').eq('restaurant_id',access.restaurant_id).eq('status','open').order('created_at',{ascending:false}),db.rpc('list_delivery_settlement_balances',{p_restaurant_id:access.restaurant_id})]);if(o.error)return alert(o.error.message);orders=o.data||[];balances=b.data||[];render();renderIncidents(i.data||[]);renderSettlements()}
function empty(){return '<p class="text-sm text-slate-400 py-8 text-center">Sin pedidos</p>'}
function elapsed(d){return Math.max(0,Math.floor((Date.now()-new Date(d))/60000))}
function card(o,dark=false){const assignment=o.assigned_driver_name?`<p class="mt-3 text-xs font-black ${dark?'text-green-300':'text-green-700'}">🛵 Aceptado por ${esc(o.assigned_driver_name)}</p><div class="grid grid-cols-2 gap-2 mt-3"><button type="button" onclick="releaseDriver(${o.id})" class="py-2 rounded-xl ${dark?'bg-slate-700 text-white':'bg-white border'} text-xs font-black">LIBERAR</button><button type="button" onclick="cancelOrder(${o.id})" class="py-2 rounded-xl bg-red-50 text-red-600 text-xs font-black">CANCELAR</button></div>`:`<p class="mt-3 text-xs font-black ${dark?'text-orange-300':'text-orange-600'}">⏳ Buscando repartidor · ganancia ${money(o.driver_earning)}</p>`;return `<article class="p-4 rounded-2xl ${dark?'bg-slate-800':'bg-slate-50 border'}"><div class="flex justify-between"><b>#${o.id}</b><span class="text-xs font-black text-orange-500">${elapsed(o.created_at)} min</span></div><p class="font-black mt-2">${esc(o.delivery_contact_name)}</p><p class="text-xs opacity-70">${esc(o.delivery_address)}</p><p class="text-xs mt-2">${(o.items||[]).map(i=>`${i.qty}× ${esc(i.nombre)}`).join('<br>')}</p><div class="flex justify-between mt-3 text-sm"><b>${money(o.total)}</b><span>${payments[o.payment_method]||o.payment_method}</span></div>${o.delivery_status==='pending_acceptance'?`<div class="grid grid-cols-2 gap-2 mt-3"><button type="button" onclick="review(${o.id},true)" class="py-2 rounded-xl bg-green-500 text-white text-xs font-black">ACEPTAR</button><button type="button" onclick="review(${o.id},false)" class="py-2 rounded-xl bg-red-50 text-red-600 text-xs font-black">RECHAZAR</button></div>`:assignment}</article>`}
function render(){const groups={new:orders.filter(o=>o.delivery_status==='pending_acceptance'),kitchen:orders.filter(o=>['accepted','preparing'].includes(o.delivery_status)),ready:orders.filter(o=>o.delivery_status==='ready_for_dispatch'),route:orders.filter(o=>['picked_up','on_the_way','arrived'].includes(o.delivery_status))};for(const k in groups){document.getElementById(`count-${k}`).textContent=groups[k].length;document.getElementById(`col-${k}`).innerHTML=groups[k].map(o=>card(o,k==='route')).join('')||empty()}const assigned=orders.filter(o=>o.assigned_driver_id).length;metrics.innerHTML=[['Activos',orders.length],['Con repartidor',assigned],['Buscando repartidor',orders.filter(o=>o.delivery_status!=='pending_acceptance'&&!o.assigned_driver_id).length],['En ruta',groups.route.length]].map(x=>`<article class="bg-white border rounded-2xl p-4"><small class="font-black text-slate-400 uppercase">${x[0]}</small><b class="block text-2xl">${x[1]}</b></article>`).join('')}
function renderIncidents(rows){incidents.innerHTML=rows.length?rows.map(i=>`<article class="p-4 bg-red-50 rounded-2xl"><b>Pedido #${i.order_id} · ${esc(i.incident_type)}</b><p class="text-sm my-2">${esc(i.notes)}</p><button type="button" onclick="resolveIncident(${i.id})" class="px-3 py-2 rounded-xl bg-slate-900 text-white text-xs font-black">MARCAR RESUELTA</button></article>`).join(''):'<p class="text-slate-400">No hay incidencias abiertas.</p>'}
function renderSettlements(){settlements.innerHTML=balances.length?balances.map(b=>{const earnings=Math.max(0,Number(b.earnings)-Number(b.earnings_paid)),cash=Math.max(0,Number(b.cash_collected)-Number(b.cash_remitted));return `<article class="p-4 bg-slate-50 border rounded-2xl"><b>${esc(b.full_name)}</b><div class="grid grid-cols-2 gap-2 mt-3 text-sm"><span>Ganancias por pagar<br><b>${money(earnings)}</b></span><span>Efectivo por recibir<br><b>${money(cash)}</b></span></div><div class="grid grid-cols-2 gap-2 mt-3"><button type="button" ${earnings<=0?'disabled':''} onclick="settle('${b.driver_id}','earning_paid',${earnings})" class="py-2 rounded-xl bg-orange-500 disabled:opacity-40 text-white text-xs font-black">PAGAR GANANCIA</button><button type="button" ${cash<=0?'disabled':''} onclick="settle('${b.driver_id}','cash_remitted',${cash})" class="py-2 rounded-xl bg-slate-900 disabled:opacity-40 text-white text-xs font-black">RECIBIR EFECTIVO</button></div></article>`}).join(''):'<p class="text-slate-400">Aún no hay saldos de repartidores.</p>'}
async function review(id,accept){const order=orders.find(o=>o.id===id);if(!accept){const reason=prompt('Motivo del rechazo');if(!reason?.trim())return;if(order?.payment_method==='mercado_pago'&&order.payment_status==='approved'){const{error}=await db.functions.invoke('refund-mercado-pago-payment',{body:{orderId:id,reason:reason.trim()}});if(error)return alert(error.message)}else{const{error}=await db.rpc('cancel_delivery_order',{p_order_id:id,p_reason:reason.trim()});if(error)return alert(error.message)}}else{const{error}=await db.rpc('accept_delivery_order',{p_order_id:id,p_accept:true});if(error)return alert(error.message)}await db.functions.invoke('send-order-notification',{body:{orderId:id}});loadAll()}
async function releaseDriver(id){const reason=prompt('Motivo para liberar al repartidor');if(!reason?.trim())return;const{error}=await db.rpc('release_delivery_order',{p_order_id:id,p_reason:reason.trim()});if(error)return alert(error.message);loadAll()}
async function cancelOrder(id){return review(id,false)}
async function resolveIncident(id){const notes=prompt('Resolución (opcional)')||'';const{error}=await db.rpc('resolve_delivery_incident',{p_incident_id:id,p_notes:notes});if(error)return alert(error.message);loadAll()}
async function settle(driverId,type,max){const amount=Number(prompt(type==='earning_paid'?`Importe pagado (máximo ${money(max)})`:`Efectivo recibido (máximo ${money(max)})`,max.toFixed(2)));if(!Number.isFinite(amount)||amount<=0)return;const{error}=await db.rpc('record_delivery_settlement',{p_restaurant_id:access.restaurant_id,p_driver_id:driverId,p_type:type,p_amount:amount,p_notes:null});if(error)return alert(error.message);loadAll()}
init();
  </script>
</body>
</html>
