<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delivery y despacho | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"><style>.delivery-column{min-height:18rem}.delivery-card{transition:.2s}.delivery-card:hover{transform:translateY(-2px)}</style></head>
<body class="bg-slate-50 min-h-screen"><header class="bg-white border-b sticky top-0 z-30"><div class="max-w-7xl mx-auto p-4 flex justify-between items-center"><div><p class="text-xs font-black text-orange-500 uppercase tracking-widest">Operación</p><h1 class="text-xl font-black">Delivery y despacho</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></div></header>
<main class="max-w-7xl mx-auto p-4 space-y-5"><section class="grid grid-cols-2 lg:grid-cols-4 gap-3" id="metrics"></section><section class="bg-white border rounded-3xl p-4 flex flex-wrap gap-3 items-center"><span id="connection" class="px-3 py-2 rounded-xl bg-green-50 text-green-700 text-xs font-black">● EN TIEMPO REAL</span><button onclick="loadAll()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-xs font-black">ACTUALIZAR</button><a href="equipo.html" class="px-4 py-2 rounded-xl bg-orange-50 text-orange-600 text-xs font-black">GESTIONAR REPARTIDORES</a></section><section class="grid md:grid-cols-2 xl:grid-cols-4 gap-4"><div class="delivery-column bg-white border rounded-3xl p-4"><h2 class="font-black flex justify-between">Nuevos <span id="count-new">0</span></h2><div id="col-new" class="space-y-3 mt-4"></div></div><div class="delivery-column bg-white border rounded-3xl p-4"><h2 class="font-black flex justify-between">En cocina <span id="count-kitchen">0</span></h2><div id="col-kitchen" class="space-y-3 mt-4"></div></div><div class="delivery-column bg-white border rounded-3xl p-4"><h2 class="font-black flex justify-between">Listos para salir <span id="count-ready">0</span></h2><div id="col-ready" class="space-y-3 mt-4"></div></div><div class="delivery-column bg-slate-900 text-white rounded-3xl p-4"><h2 class="font-black flex justify-between">En ruta <span id="count-route">0</span></h2><div id="col-route" class="space-y-3 mt-4"></div></div></section><section class="bg-white border rounded-3xl p-5"><h2 class="font-black text-lg">Incidencias abiertas</h2><div id="incidents" class="grid md:grid-cols-2 gap-3 mt-4"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;let access,orders=[],drivers=[],channel;const money=n=>`$${Number(n||0).toFixed(2)}`,labels={cash:'Efectivo al entregar',mercado_pago:'Mercado Pago'},states={pending_acceptance:'Nuevo',accepted:'Aceptado',preparing:'En preparación',ready_for_dispatch:'Listo',picked_up:'Recogido',on_the_way:'En camino',arrived:'En domicilio'};
async function init(){access=await window.serveYourself.requireRestaurantPermission('can_manage_delivery');if(!access)return;window.serveYourself.renderRestaurantNavigation(access);await loadAll();channel=db.channel(`delivery-${access.restaurant_id}`).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:`restaurant_id=eq.${access.restaurant_id}`},loadAll).on('postgres_changes',{event:'*',schema:'public',table:'delivery_events',filter:`restaurant_id=eq.${access.restaurant_id}`},loadAll).subscribe(s=>document.getElementById('connection').textContent=s==='SUBSCRIBED'?'● EN TIEMPO REAL':'○ RECONECTANDO');setInterval(loadAll,30000)}
async function loadAll(){const [o,d,i]=await Promise.all([db.from('orders').select('*').eq('restaurant_id',access.restaurant_id).eq('service_type','delivery').not('delivery_status','in','(delivered,cancelled)').order('created_at'),db.rpc('list_delivery_drivers',{p_restaurant_id:access.restaurant_id}),db.from('delivery_incidents').select('*').eq('restaurant_id',access.restaurant_id).eq('status','open').order('created_at',{ascending:false})]);if(o.error||d.error)return alert(o.error?.message||d.error?.message);orders=o.data||[];drivers=d.data||[];render();renderIncidents(i.data||[])}
function empty(){return '<p class="text-sm text-slate-400 py-8 text-center">Sin pedidos</p>'}function elapsed(d){return Math.max(0,Math.floor((Date.now()-new Date(d))/60000))}
function card(o,dark=false){const assign=drivers.length?`<select onchange="assign(${o.id},this.value)" class="w-full p-2 rounded-xl border text-xs font-bold text-slate-900"><option value="">Asignar repartidor</option>${drivers.map(d=>`<option value="${d.user_id}" ${o.assigned_driver_id===d.user_id?'selected':''}>${esc(d.full_name)}${d.is_available?' · disponible':''}</option>`).join('')}</select>`:'<a href="equipo.html" class="text-xs text-orange-500 font-black">Agrega un repartidor</a>';return `<article class="delivery-card p-4 rounded-2xl ${dark?'bg-slate-800':'bg-slate-50 border'}"><div class="flex justify-between"><b>#${o.id}</b><span class="text-xs font-black ${elapsed(o.created_at)>30?'text-red-500':'text-orange-500'}">${elapsed(o.created_at)} min</span></div><p class="font-black mt-2">${esc(o.delivery_contact_name)}</p><p class="text-xs opacity-70 mt-1">${esc(o.delivery_address)}</p><p class="text-xs mt-2">${o.items.map(i=>`${i.qty}× ${esc(i.nombre)}`).join('<br>')}</p><div class="flex justify-between mt-3 text-sm"><b>${money(o.total)}</b><span>${labels[o.payment_method]||o.payment_method}</span></div>${o.delivery_status!=='pending_acceptance'?`<div class="mt-3">${assign}</div>`:''}${o.assigned_driver_name?`<p class="text-xs font-bold mt-2">🛵 ${esc(o.assigned_driver_name)}</p>`:''}${o.delivery_status==='pending_acceptance'?`<div class="grid grid-cols-2 gap-2 mt-3"><button onclick="review(${o.id},true)" class="py-2 rounded-xl bg-green-500 text-white text-xs font-black">ACEPTAR</button><button onclick="review(${o.id},false)" class="py-2 rounded-xl bg-red-50 text-red-600 text-xs font-black">RECHAZAR</button></div>`:''}</article>`}
function render(){const groups={new:orders.filter(o=>o.delivery_status==='pending_acceptance'),kitchen:orders.filter(o=>['accepted','preparing'].includes(o.delivery_status)),ready:orders.filter(o=>o.delivery_status==='ready_for_dispatch'),route:orders.filter(o=>['picked_up','on_the_way','arrived'].includes(o.delivery_status))};for(const k of Object.keys(groups)){document.getElementById(`count-${k}`).textContent=groups[k].length;document.getElementById(`col-${k}`).innerHTML=groups[k].map(o=>card(o,k==='route')).join('')||empty()}const cash=orders.filter(o=>o.payment_method==='cash').length,mp=orders.filter(o=>o.payment_method==='mercado_pago').length,available=drivers.filter(d=>d.is_available).length;document.getElementById('metrics').innerHTML=[['Activos',orders.length],['Efectivo',cash],['Mercado Pago',mp],['Repartidores disponibles',available]].map(x=>`<article class="bg-white border rounded-2xl p-4"><small class="font-black text-slate-400 uppercase">${x[0]}</small><b class="block text-2xl mt-1">${x[1]}</b></article>`).join('')}
function renderIncidents(rows){document.getElementById('incidents').innerHTML=rows.length?rows.map(i=>`<article class="p-4 bg-red-50 rounded-2xl"><b>Pedido #${i.order_id} · ${esc(i.incident_type)}</b><p class="text-sm mt-1">${esc(i.notes)}</p><small>${new Date(i.created_at).toLocaleString('es-MX')}</small></article>`).join(''):'<p class="text-slate-400">No hay incidencias abiertas.</p>'}
async function review(id,accept){if(!accept&&!confirm('¿Rechazar este pedido?'))return;const{error}=await db.rpc('accept_delivery_order',{p_order_id:id,p_accept:accept});if(error)return alert(error.message);await db.functions.invoke('send-order-notification',{body:{orderId:id}});loadAll()}async function assign(id,user){if(!user)return;const{error}=await db.rpc('assign_delivery_driver',{p_order_id:id,p_driver_id:user});if(error)return alert(error.message);await db.functions.invoke('send-order-notification',{body:{orderId:id}});loadAll()}init();
</script></body></html>
