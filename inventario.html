<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Estaciones | ServeYourself</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="tailwind.generated.css"><link rel="stylesheet" href="styles.css"></head><body class="bg-slate-50 min-h-screen inventory-page"><header class="bg-white border-b sticky top-0 z-30"><div class="max-w-6xl mx-auto p-4 flex justify-between items-center"><div class="min-w-0"><p class="text-xs font-black text-orange-500 uppercase tracking-widest">Administración</p><h1 class="text-xl font-black">Estaciones de cocina</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></div></header>
<main class="max-w-6xl mx-auto p-4 space-y-5">
<section class="bg-white border rounded-3xl p-5"><h2 class="text-xl font-black">Estaciones de cocina</h2><p class="text-sm text-slate-500">Envía productos a cocina, barra, postres u otra estación.</p><form id="station-form" class="flex gap-2 mt-4"><input type="text" id="station-name" required maxlength="40" placeholder="Ej. Barra" class="flex-1 p-3 border rounded-xl"><input id="station-color" type="color" value="#f97316" class="w-14 p-1 border rounded-xl"><button type="submit" class="px-4 rounded-xl bg-slate-900 text-white font-black">AGREGAR</button></form><div id="station-list" class="mt-5 space-y-2"></div><h3 class="font-black mt-7">Asignar productos</h3><div id="product-stations" class="mt-3 space-y-2"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;let access,stations=[],products=[];
async function init(){access=await window.serveYourself.requireRestaurantAccess(['owner']);if(!access)return;window.serveYourself.renderRestaurantNavigation(access);await loadAll();}
async function loadAll(){const [s,p]=await Promise.all([db.from('kitchen_stations').select('*').eq('restaurant_id',access.restaurant_id).order('name'),db.from('products').select('*').eq('restaurant_id',access.restaurant_id).order('name')]);if(s.error||p.error)return alert('No se pudieron cargar las estaciones. Reintenta.');stations=s.data||[];products=p.data||[];render();}
function render(){document.getElementById('station-list').innerHTML=stations.map(s=>`<div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl"><span class="w-4 h-4 rounded-full" style="background:${esc(s.color)}"></span><b class="flex-1">${esc(s.name)}</b><button type="button" onclick="removeStation(${s.id})" class="text-red-500">Eliminar</button></div>`).join('')||'<p class="text-slate-400">Crea Cocina, Barra o Postres.</p>';document.getElementById('product-stations').innerHTML=products.map(p=>`<label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl"><b class="flex-1">${esc(p.name)}</b><select onchange="assignStation('${p.id}',this.value)" class="p-2 border rounded-lg"><option value="">General</option>${stations.map(s=>`<option value="${s.id}" ${s.id===p.kitchen_station_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`).join('');}
document.getElementById('station-form').addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.from('kitchen_stations').insert({restaurant_id:access.restaurant_id,name:document.getElementById('station-name').value.trim(),color:document.getElementById('station-color').value});if(error)return alert(error.message);e.target.reset();loadAll();});
async function assignStation(id,value){const{error}=await db.from('products').update({kitchen_station_id:value?Number(value):null}).eq('id',id);if(error)alert(error.message);else loadAll();}
async function removeStation(id){if(!confirm('¿Eliminar esta estación? Los productos pasarán a General.'))return;const{error}=await db.from('kitchen_stations').delete().eq('id',id);if(error)alert(error.message);else loadAll();}
init();
</script></body></html>
