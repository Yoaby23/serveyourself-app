<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head><body class="bg-slate-50 min-h-screen"><header class="bg-white border-b sticky top-0 z-30"><div class="max-w-6xl mx-auto p-4 flex justify-between items-center"><div><p class="text-xs font-black text-orange-500 uppercase tracking-widest">Administración</p><h1 class="text-xl font-black">Inventario y producción</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></div></header>
<main class="max-w-6xl mx-auto p-4 grid lg:grid-cols-2 gap-5">
<section class="bg-white border rounded-3xl p-5"><h2 class="text-xl font-black">Ingredientes</h2><p class="text-sm text-slate-500">Existencias, costo y alertas de mínimos.</p><form id="ingredient-form" class="grid grid-cols-2 gap-2 mt-4"><input id="ingredient-name" required maxlength="80" placeholder="Ingrediente" class="col-span-2 p-3 border rounded-xl"><select id="ingredient-unit" class="p-3 border rounded-xl"><option>pieza</option><option>g</option><option>kg</option><option>ml</option><option>l</option></select><input id="ingredient-stock" type="number" step="0.001" value="0" class="p-3 border rounded-xl" placeholder="Existencia"><input id="ingredient-min" type="number" step="0.001" value="0" class="p-3 border rounded-xl" placeholder="Mínimo"><input id="ingredient-cost" type="number" step="0.01" value="0" class="p-3 border rounded-xl" placeholder="Costo unitario"><button class="col-span-2 py-3 rounded-xl bg-orange-500 text-white font-black">AGREGAR INGREDIENTE</button></form><div id="ingredient-list" class="mt-5 space-y-2"></div></section>
<section class="bg-white border rounded-3xl p-5"><h2 class="text-xl font-black">Estaciones de cocina</h2><p class="text-sm text-slate-500">Envía productos a cocina, barra, postres u otra estación.</p><form id="station-form" class="flex gap-2 mt-4"><input id="station-name" required maxlength="40" placeholder="Ej. Barra" class="flex-1 p-3 border rounded-xl"><input id="station-color" type="color" value="#f97316" class="w-14 p-1 border rounded-xl"><button class="px-4 rounded-xl bg-slate-900 text-white font-black">AGREGAR</button></form><div id="station-list" class="mt-5 space-y-2"></div><h3 class="font-black mt-7">Asignar productos</h3><div id="product-stations" class="mt-3 space-y-2"></div></section>
<section class="lg:col-span-2 bg-white border rounded-3xl p-5"><h2 class="text-xl font-black">Recetas</h2><p class="text-sm text-slate-500">Al comenzar una comanda se descontarán automáticamente sus ingredientes.</p><div class="grid sm:grid-cols-[1fr_1fr_140px_auto] gap-2 mt-4"><select id="recipe-product" class="p-3 border rounded-xl"></select><select id="recipe-ingredient" class="p-3 border rounded-xl"></select><input id="recipe-qty" type="number" min="0.001" step="0.001" value="1" class="p-3 border rounded-xl"><button onclick="saveRecipe()" class="px-5 rounded-xl bg-emerald-600 text-white font-black">GUARDAR</button></div><div id="recipe-list" class="grid md:grid-cols-2 gap-3 mt-5"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;let access,ingredients=[],stations=[],products=[],recipes=[];
async function init(){access=await window.serveYourself.requireRestaurantAccess(['owner']);if(!access)return;window.serveYourself.renderRestaurantNavigation(access);await loadAll();}
async function loadAll(){const [i,s,p,r]=await Promise.all([db.from('ingredients').select('*').eq('restaurant_id',access.restaurant_id).order('name'),db.from('kitchen_stations').select('*').eq('restaurant_id',access.restaurant_id).order('name'),db.from('products').select('*').eq('restaurant_id',access.restaurant_id).order('name'),db.from('product_recipes').select('*')]);if([i,s,p,r].some(x=>x.error))return alert('Aplica primero la migración 008 en Supabase.');ingredients=i.data||[];stations=s.data||[];products=p.data||[];recipes=r.data||[];render();}
function render(){document.getElementById('ingredient-list').innerHTML=ingredients.map(i=>`<div class="p-3 rounded-xl ${Number(i.stock)<=Number(i.minimum_stock)?'bg-red-50 border border-red-200':'bg-slate-50'}"><div class="flex justify-between"><span><b>${esc(i.name)}</b><small class="block text-slate-500">${Number(i.stock)} ${i.unit} · mínimo ${Number(i.minimum_stock)} · $${Number(i.unit_cost).toFixed(2)}/${i.unit}</small></span><button onclick="adjust('${i.id}')" class="text-xs font-black text-orange-600">AJUSTAR</button></div></div>`).join('')||'<p class="text-slate-400">Sin ingredientes.</p>';document.getElementById('station-list').innerHTML=stations.map(s=>`<div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl"><span class="w-4 h-4 rounded-full" style="background:${esc(s.color)}"></span><b class="flex-1">${esc(s.name)}</b><button onclick="removeStation(${s.id})" class="text-red-500">Eliminar</button></div>`).join('')||'<p class="text-slate-400">Crea Cocina, Barra o Postres.</p>';document.getElementById('product-stations').innerHTML=products.map(p=>`<label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl"><b class="flex-1">${esc(p.name)}</b><select onchange="assignStation('${p.id}',this.value)" class="p-2 border rounded-lg"><option value="">General</option>${stations.map(s=>`<option value="${s.id}" ${s.id===p.kitchen_station_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`).join('');document.getElementById('recipe-product').innerHTML=products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');document.getElementById('recipe-ingredient').innerHTML=ingredients.map(i=>`<option value="${i.id}">${esc(i.name)} (${i.unit})</option>`).join('');document.getElementById('recipe-list').innerHTML=products.map(p=>{const lines=recipes.filter(r=>r.product_id===p.id);return lines.length?`<article class="border rounded-2xl p-4"><b>${esc(p.name)}</b>${lines.map(r=>{const i=ingredients.find(x=>x.id===r.ingredient_id);return `<div class="flex justify-between text-sm mt-2"><span>${esc(i?.name||'Ingrediente')} · ${Number(r.quantity)} ${i?.unit||''}</span><button onclick="removeRecipe('${p.id}','${r.ingredient_id}')" class="text-red-500">×</button></div>`}).join('')}</article>`:''}).join('')||'<p class="text-slate-400">Todavía no hay recetas.</p>';}
document.getElementById('ingredient-form').addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.from('ingredients').insert({restaurant_id:access.restaurant_id,name:document.getElementById('ingredient-name').value.trim(),unit:document.getElementById('ingredient-unit').value,stock:Number(document.getElementById('ingredient-stock').value),minimum_stock:Number(document.getElementById('ingredient-min').value),unit_cost:Number(document.getElementById('ingredient-cost').value)});if(error)return alert(error.message);e.target.reset();loadAll();});
document.getElementById('station-form').addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.from('kitchen_stations').insert({restaurant_id:access.restaurant_id,name:document.getElementById('station-name').value.trim(),color:document.getElementById('station-color').value});if(error)return alert(error.message);e.target.reset();loadAll();});
async function adjust(id){const value=prompt('Cantidad a sumar. Usa un número negativo para descontar.');if(value===null)return;const reason=prompt('Motivo del ajuste')||'Ajuste manual';const type=Number(value)<0?'waste':'purchase';const{error}=await db.rpc('adjust_inventory',{p_ingredient_id:id,p_quantity:Number(value),p_type:type,p_reason:reason});if(error)return alert(error.message);loadAll();}
async function assignStation(id,value){const{error}=await db.from('products').update({kitchen_station_id:value?Number(value):null}).eq('id',id);if(error)alert(error.message);else loadAll();}
async function removeStation(id){if(!confirm('¿Eliminar esta estación? Los productos pasarán a General.'))return;const{error}=await db.from('kitchen_stations').delete().eq('id',id);if(error)alert(error.message);else loadAll();}
async function saveRecipe(){const{error}=await db.from('product_recipes').upsert({product_id:document.getElementById('recipe-product').value,ingredient_id:document.getElementById('recipe-ingredient').value,quantity:Number(document.getElementById('recipe-qty').value)});if(error)alert(error.message);else loadAll();}
async function removeRecipe(product,ingredient){const{error}=await db.from('product_recipes').delete().eq('product_id',product).eq('ingredient_id',ingredient);if(error)alert(error.message);else loadAll();}init();
</script></body></html>
