<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis entregas | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head><body class="bg-slate-50 min-h-screen"><header class="bg-white border-b sticky top-0 z-30"><div class="max-w-3xl mx-auto p-4 flex justify-between items-center"><div><p class="text-xs font-black text-orange-500 uppercase">Repartidor</p><h1 class="text-xl font-black">Mis entregas</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></div></header><main class="max-w-3xl mx-auto p-4 space-y-5"><section class="bg-slate-900 text-white rounded-3xl p-5 flex justify-between items-center"><div><b id="availability-title">No disponible</b><p class="text-xs text-slate-400 mt-1">Controla si puedes recibir asignaciones.</p></div><button id="availability" onclick="toggleAvailability()" class="px-5 py-3 rounded-2xl bg-white text-slate-900 font-black text-xs">CONECTARME</button></section><section id="orders" class="space-y-4"></section></main>
<dialog id="code-dialog" class="rounded-3xl p-0 backdrop:bg-black/60 w-[92%] max-w-sm"><form method="dialog" class="p-6"><h2 class="text-xl font-black">Confirmar entrega</h2><p class="text-sm text-slate-500 mt-2">Pide al cliente su código de 4 dígitos. En efectivo, confirma también que recibiste el total.</p><input id="delivery-code" inputmode="numeric" maxlength="4" class="w-full mt-5 p-4 rounded-2xl border text-center text-3xl tracking-[.5em] font-black"><div class="grid grid-cols-2 gap-2 mt-4"><button value="cancel" class="py-3 rounded-xl bg-slate-100 font-black">CANCELAR</button><button type="button" onclick="confirmDelivery()" class="py-3 rounded-xl bg-green-500 text-white font-black">ENTREGADO</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;let access,user,orders=[],available=false,currentOrder=null,watchId=null;const labels={ready_for_dispatch:'Listo para recoger',picked_up:'Pedido recogido',on_the_way:'En camino',arrived:'En el domicilio'},money=n=>`$${Number(n||0).toFixed(2)}`;
async function init(){access=await window.serveYourself.requireRestaurantPermission('can_deliver_orders');if(!access)return;user=access.user;window.serveYourself.renderRestaurantNavigation(access);const s=await db.from('delivery_driver_status').select('*').eq('restaurant_id',access.restaurant_id).eq('user_id',user.id).maybeSingle();available=Boolean(s.data?.is_available);renderAvailability();await load();db.channel(`driver-${user.id}`).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:`assigned_driver_id=eq.${user.id}`},load).subscribe();setInterval(load,30000)}
async function load(){const{data,error}=await db.from('orders').select('*').eq('assigned_driver_id',user.id).eq('service_type','delivery').in('delivery_status',['accepted','preparing','ready_for_dispatch','picked_up','on_the_way','arrived']).order('created_at');if(error)return alert(error.message);orders=data||[];render()}
function renderAvailability(){document.getElementById('availability-title').textContent=available?'Disponible para entregas':'No disponible';document.getElementById('availability').textContent=available?'DESCONECTARME':'CONECTARME';document.getElementById('availability').className=`px-5 py-3 rounded-2xl font-black text-xs ${available?'bg-green-500 text-white':'bg-white text-slate-900'}`}
function render(){document.getElementById('orders').innerHTML=orders.length?orders.map(o=>`<article class="bg-white border rounded-3xl p-5"><div class="flex justify-between"><div><small class="text-orange-500 font-black uppercase">${labels[o.delivery_status]||'Asignado'}</small><h2 class="text-xl font-black mt-1">Pedido #${o.id}</h2></div><b>${money(o.total)}</b></div><div class="mt-4 p-4 bg-slate-50 rounded-2xl"><b>${esc(o.delivery_contact_name)}</b><a href="tel:${esc(o.delivery_contact_phone)}" class="block text-blue-600 text-sm mt-1">📞 ${esc(o.delivery_contact_phone)}</a><p class="text-sm mt-2">${esc(o.delivery_address)}</p>${o.delivery_reference?`<p class="text-xs text-slate-500 mt-1">Referencia: ${esc(o.delivery_reference)}</p>`:''}</div><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${o.delivery_latitude},${o.delivery_longitude}" class="block text-center w-full mt-3 py-3 rounded-xl bg-blue-50 text-blue-700 font-black text-xs">ABRIR RUTA EN MAPAS</a><div class="mt-3">${action(o)}</div><button onclick="incident(${o.id})" class="w-full mt-2 py-2 text-red-500 text-xs font-black">REPORTAR PROBLEMA</button></article>`).join(''):'<div class="bg-white border rounded-3xl p-12 text-center"><span class="text-5xl">🛵</span><h2 class="font-black mt-4">Sin entregas asignadas</h2><p class="text-sm text-slate-400 mt-1">Cuando despacho te asigne una, aparecerá aquí.</p></div>'}
function action(o){if(['accepted','preparing'].includes(o.delivery_status))return '<p class="text-center text-sm text-slate-400">Espera a que cocina termine el pedido.</p>';if(o.delivery_status==='ready_for_dispatch')return `<button onclick="advance(${o.id},'picked_up')" class="w-full py-4 bg-orange-500 text-white rounded-2xl font-black">RECOGÍ EL PEDIDO</button>`;if(o.delivery_status==='picked_up')return `<button onclick="advance(${o.id},'on_the_way')" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black">INICIAR RUTA</button>`;if(o.delivery_status==='on_the_way')return `<button onclick="advance(${o.id},'arrived')" class="w-full py-4 bg-purple-600 text-white rounded-2xl font-black">LLEGUÉ AL DOMICILIO</button>`;return `<button onclick="openCode(${o.id})" class="w-full py-4 bg-green-500 text-white rounded-2xl font-black">CONFIRMAR ENTREGA</button>`}
function locate(){return new Promise(resolve=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>resolve([p.coords.latitude,p.coords.longitude]),()=>resolve([null,null]),{enableHighAccuracy:true,timeout:8000}):resolve([null,null]))}
async function toggleAvailability(){const [lat,lng]=await locate();const next=!available,{error}=await db.rpc('set_driver_availability',{p_available:next,p_latitude:lat,p_longitude:lng});if(error)return alert(error.message);available=next;renderAvailability()}
async function advance(id,status){const[lat,lng]=await locate();const{error}=await db.rpc('advance_delivery_order',{p_order_id:id,p_status:status,p_latitude:lat,p_longitude:lng});if(error)return alert(error.message);await db.functions.invoke('send-order-notification',{body:{orderId:id}});if(status==='on_the_way')startTracking(id);load()}
function startTracking(id){if(watchId!==null||!navigator.geolocation)return;watchId=navigator.geolocation.watchPosition(p=>db.rpc('update_delivery_location',{p_order_id:id,p_latitude:p.coords.latitude,p_longitude:p.coords.longitude}),()=>{}, {enableHighAccuracy:true,maximumAge:15000,timeout:20000})}
function openCode(id){currentOrder=id;document.getElementById('delivery-code').value='';document.getElementById('code-dialog').showModal()}
async function confirmDelivery(){const code=document.getElementById('delivery-code').value.trim();if(!/^\d{4}$/.test(code))return alert('Captura los 4 dígitos.');const{error}=await db.rpc('confirm_delivery',{p_order_id:currentOrder,p_code:code});if(error)return alert(error.message);if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;document.getElementById('code-dialog').close();alert('Entrega confirmada.');load()}
async function incident(id){const type=prompt('Tipo: customer_unavailable, wrong_address, vehicle, delay u other','customer_unavailable');if(!type)return;const notes=prompt('Describe el problema');if(!notes)return;const{error}=await db.rpc('report_delivery_incident',{p_order_id:id,p_type:type,p_notes:notes});if(error)return alert(error.message);alert('Incidencia enviada a despacho.')}init();
</script></body></html>
