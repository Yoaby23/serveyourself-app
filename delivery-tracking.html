<!DOCTYPE html><html lang="es"><head><script src="theme.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>ServeYourself</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="tailwind.generated.css"><link rel="stylesheet" href="styles.css"><style>#map{height:260px}.step.active .dot{background:#f97316;color:white}.step.done .dot{background:#22c55e;color:white}.step:not(:last-child):after{content:'';position:absolute;left:19px;top:40px;width:2px;height:32px;background:#e2e8f0}</style><link rel="stylesheet" href="theme.css"></head><body class="bg-slate-50 min-h-screen"><header class="bg-white border-b"><div class="max-w-2xl mx-auto p-4 flex items-center gap-3"><a data-sy-back href="menu.html" aria-label="Volver a mis pedidos" class="w-10 h-10 rounded-xl bg-orange-50 text-orange-600 flex items-center justify-center font-black">←</a><div><p class="text-xs font-black text-orange-500 uppercase">Delivery</p><h1 class="text-xl font-black">Sigue tu pedido</h1></div></div></header><main class="max-w-2xl mx-auto p-4 space-y-4"><p id="tracking-status" class="text-sm text-slate-500" role="status" aria-live="polite"></p><section id="hero" class="bg-slate-900 text-white rounded-3xl p-6"></section><section class="bg-white border rounded-3xl overflow-hidden"><div id="map"></div><div class="p-4 text-xs text-slate-500">La ubicación del repartidor aparece cuando inicia la ruta y permite compartir GPS.</div></section><section class="bg-white border rounded-3xl p-5"><h2 class="font-black">Estado de la entrega</h2><div id="steps" class="mt-5"></div></section><section id="details" class="bg-white border rounded-3xl p-5"></section></main><script src="/vendor/supabase.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app-config.js"></script><script src="business-image.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;const id=new URLSearchParams(location.search).get('id');let order,map,customerMarker,driverMarker,loadVersion=0;const sequence=['pending_acceptance','accepted','preparing','ready_for_dispatch','picked_up','on_the_way','arrived','delivered'],names={pending_acceptance:'Esperando confirmación',accepted:'Pedido aceptado',preparing:'En preparación',ready_for_dispatch:'Listo para salir',picked_up:'Recogido por el repartidor',on_the_way:'En camino',arrived:'El repartidor llegó',delivered:'Entregado',cancelled:'Cancelado'},money=n=>`$${Number(n||0).toFixed(2)}`;
async function init(){
 const user=await window.serveYourself.requireUser();if(!user)return;
 if(!/^\d+$/.test(id||'')){location.href='menu.html';return;}
 if(typeof L!=='undefined'){
  map=L.map('map',{zoomControl:false}).setView([19.4326,-99.1332],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
 }else document.getElementById('map').textContent='El mapa no está disponible; puedes consultar el estado de tu pedido.';
 if(new URLSearchParams(location.search).get('payment')==='success'){
  try{await window.serveYourself.reconcileMercadoPagoOrder(id);}catch{document.getElementById('tracking-status').textContent='Confirmación de pago pendiente. Se actualizará al recuperar la conexión.';}
 }
 await load();
 db.channel(`tracking-${id}`).on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:`id=eq.${id}`},load).subscribe();
 setInterval(()=>{if(!document.hidden)load();},20000);
 window.addEventListener('online',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
}
async function load(){
 const version=++loadVersion;
 try{
  const {data,error}=await db.from('orders').select('*').eq('id',id).eq('service_type','delivery').maybeSingle();
  if(version!==loadVersion)return;
  if(error)throw error;
  if(!data){document.getElementById('tracking-status').textContent='No se encontró esta entrega o no tienes acceso. Puedes volver a Mis pedidos.';return;}
  order=data;render();document.getElementById('tracking-status').textContent='Estado actualizado.';
 }catch(error){if(version===loadVersion)document.getElementById('tracking-status').textContent='Sin conexión. Conservamos el último estado y volveremos a actualizarlo.';}
}
function render(){const state=order.status==='cancelado'?'cancelled':order.delivery_status||'pending_acceptance',idx=sequence.indexOf(state);document.getElementById('hero').innerHTML=`<div class="flex justify-between"><div><small class="text-orange-400 font-black uppercase">Pedido #${order.id}</small><h2 class="text-2xl font-black mt-2">${esc(names[state]||state)}</h2></div><b class="text-xl">${money(order.total)}</b></div>${order.assigned_driver_name?`<p class="text-sm text-slate-300 mt-4"> Reparte ${esc(order.assigned_driver_name)}</p>`:''}<div class="mt-5 p-4 bg-white/10 rounded-2xl"><small class="uppercase text-slate-400 font-black">Código de entrega</small><p class="text-4xl tracking-[.35em] font-black mt-1">${esc(order.delivery_code||'----')}</p><p class="text-xs text-slate-400 mt-1">Compártelo únicamente cuando recibas tu pedido.</p></div>`;document.getElementById('steps').innerHTML=state==='cancelled'?'<div class="p-4 bg-red-50 text-red-600 rounded-2xl font-black">Este pedido fue cancelado.</div>':sequence.slice(0,idx+2).filter((_,i)=>i<=Math.max(idx+1,1)).map((s,i)=>`<div class="step relative flex gap-3 pb-5 ${i<idx?'done':i===idx?'active':''}"><span class="dot w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-black">${i<idx?'✓':i+1}</span><div><b>${esc(names[s])}</b>${i===idx?'<p class="text-xs text-orange-500">Estado actual</p>':''}</div></div>`).join('');document.getElementById('details').innerHTML=`<h2 class="font-black">Entrega</h2><p class="text-sm mt-3">${esc(order.delivery_address)}</p>${order.delivery_reference?`<p class="text-xs text-slate-500 mt-1">${esc(order.delivery_reference)}</p>`:''}<div class="border-t mt-4 pt-4 flex justify-between"><span>Productos</span><b>${money(order.subtotal)}</b></div><div class="flex justify-between mt-2"><span>Envío</span><b>${money(order.delivery_fee)}</b></div><div class="flex justify-between mt-2"><span>Pago</span><b>${order.payment_method==='cash'?'Efectivo al entregar':`Mercado Pago · ${order.payment_status==='approved'?'aprobado':esc(order.payment_status||'pendiente')}`}</b></div>`;updateMap()}
function updateMap(){if(!map||order.delivery_latitude==null||order.delivery_longitude==null)return;const customer=[order.delivery_latitude,order.delivery_longitude];if(!customerMarker)customerMarker=L.marker(customer).addTo(map).bindPopup('Dirección de entrega');if(order.driver_latitude!=null&&order.driver_longitude!=null){const point=[order.driver_latitude,order.driver_longitude];if(!driverMarker)driverMarker=L.marker(point).addTo(map).bindPopup('Repartidor');else driverMarker.setLatLng(point);map.fitBounds([customer,point],{padding:[40,40]})}else map.setView(customer,15)}init();
</script></body></html>
