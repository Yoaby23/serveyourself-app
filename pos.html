<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de venta | ServeYourself</title>
    <link rel="icon" href="logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 min-h-screen">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div><p class="text-xs font-black text-orange-500 uppercase tracking-widest">Punto de venta</p><h1 id="restaurant-name" class="text-xl font-black">ServeYourself</h1></div>
            <div id="restaurant-nav" class="sy-restaurant-nav"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-[1fr_390px] gap-5">
        <section>
            <section id="ready-panel" class="hidden bg-green-50 border border-green-200 rounded-3xl p-4 mb-5">
                <div class="flex items-center justify-between gap-3"><div><p class="text-xs font-black text-green-700 uppercase tracking-wider">Listos para entregar</p><h2 class="font-black text-green-950 mt-1">Mis comandas listas</h2></div><span id="ready-count" class="px-3 py-1 rounded-full bg-green-200 text-green-900 font-black">0</span></div>
                <div id="ready-orders" class="grid sm:grid-cols-2 gap-3 mt-4"></div>
            </section>
            <details id="pending-panel" class="hidden bg-amber-50 border border-amber-200 rounded-3xl p-4 mb-5">
                <summary class="font-black text-amber-900 cursor-pointer">Cuentas pendientes <span id="pending-count" class="ml-2 px-2 py-1 rounded-full bg-amber-200 text-xs">0</span></summary>
                <div id="pending-orders" class="grid sm:grid-cols-2 gap-3 mt-4"><p class="text-sm text-amber-700">No hay cuentas pendientes.</p></div>
            </details>
            <div id="command-builder">
                <div class="flex flex-col sm:flex-row gap-3 mb-5">
                    <input id="product-search" type="search" placeholder="Buscar producto..." class="flex-1 p-4 rounded-2xl border border-slate-200 bg-white font-bold">
                    <select id="category-filter" class="p-4 rounded-2xl border border-slate-200 bg-white font-bold"><option value="">Todas las categorías</option></select>
                </div>
                <div id="product-grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            </div>
        </section>

        <aside id="order-cart" class="lg:sticky lg:top-24 lg:self-start bg-white rounded-3xl border border-slate-200 shadow-sm p-5">
            <div class="flex justify-between items-center"><h2 class="text-xl font-black">Pedido</h2><button id="clear-cart" class="text-xs font-black text-red-500">VACIAR</button></div>
            <div class="grid grid-cols-2 gap-2 mt-4">
                <button data-service="dine_in" class="service-btn p-3 rounded-xl bg-slate-900 text-white font-black">En mesa</button>
                <button data-service="pickup" class="service-btn p-3 rounded-xl bg-slate-100 text-slate-600 font-black">Para llevar</button>
            </div>
            <label id="table-wrap" class="block mt-3 text-xs font-black text-slate-500 uppercase">Mesa
                <select id="table-select" class="w-full mt-2 p-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 normal-case"><option value="">Selecciona una mesa</option></select>
            </label>
            <label class="block mt-3 text-xs font-black text-slate-500 uppercase">Cuenta
                <select id="open-account" class="w-full mt-2 p-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 normal-case"><option value="">Nueva cuenta</option></select>
                <small class="block mt-1 normal-case font-medium text-slate-400">Selecciona una cuenta para agregar una nueva ronda.</small>
            </label>
            <div id="cart-items" class="my-5 space-y-3 max-h-[38vh] overflow-y-auto"><p class="text-center text-slate-400 py-8">Agrega productos al pedido.</p></div>
            <textarea id="order-notes" maxlength="500" rows="2" placeholder="Notas para cocina" class="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm"></textarea>
            <div class="flex justify-between items-end mt-5 pt-5 border-t border-slate-100"><span class="font-bold text-slate-500">Total</span><strong id="cart-total" class="text-3xl">$0.00</strong></div>
            <button id="submit-order" class="w-full mt-4 py-4 rounded-2xl bg-orange-500 text-white font-black text-sm uppercase tracking-wider">Enviar a cocina</button>
        </aside>
    </main>

    <div id="success-modal" class="hidden fixed inset-0 z-50 bg-slate-950/60 p-4 items-center justify-center">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center">
            <div class="text-5xl mb-3">✅</div><h2 id="success-title" class="text-2xl font-black">Pedido registrado</h2><p id="success-order" class="text-slate-500 mt-2"></p>
            <button id="print-button" onclick="printTicket()" class="w-full mt-5 py-4 rounded-2xl bg-slate-900 text-white font-black">IMPRIMIR COMANDA</button>
            <label id="modal-payment-wrap" class="block mt-4 text-left text-xs font-black text-slate-500 uppercase">Forma de pago
                <select id="modal-payment-method" class="w-full mt-2 p-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 normal-case font-bold">
                    <option value="cash">Efectivo</option><option value="transfer">Transferencia</option><option value="card_terminal">Tarjeta · terminal</option>
                </select>
            </label>
            <button id="charge-button" onclick="chargeLastOrder()" class="w-full mt-2 py-4 rounded-2xl bg-green-600 text-white font-black">MARCAR COMO PAGADO</button>
            <button onclick="closeSuccess()" class="w-full mt-2 py-4 rounded-2xl bg-orange-50 text-orange-600 font-black">NUEVA VENTA</button>
        </div>
    </div>

    <section id="print-ticket" class="ticket-print" aria-hidden="true"></section>
    <div id="ready-alert" class="ready-order-alert hidden" role="status" aria-live="assertive"></div>
    <audio id="ready-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app-config.js"></script><script src="app.js"></script>
    <script>
        const db = window.serveYourself.supabase;
        const esc = window.serveYourself.escapeHtml;
        let access, products = [], tables = [], pendingOrders = [], openAccounts = [], serviceType = 'dine_in', lastOrder = null, resetCartOnClose = false;
        const paymentLabels = { cash: 'Efectivo', transfer: 'Transferencia', card_terminal: 'Tarjeta · terminal', mixed: 'Pago combinado' };
        const cart = new Map();

        async function init() {
            access = await window.serveYourself.requireRestaurantAccess(['owner', 'manager', 'waiter', 'cashier', 'kitchen']);
            if (!access) return;
            if (!access.can_create_orders && !access.can_close_accounts) {
                alert('Tu cuenta no tiene permisos para comandas ni caja.');
                window.location.replace(access.can_view_kitchen ? 'cocina.html' : 'menu.html');
                return;
            }
            document.getElementById('restaurant-name').textContent = access.business_name;
            window.serveYourself.renderRestaurantNavigation(access);
            window.serveYourself.initPushNotifications(access.user);
            document.getElementById('pending-panel').classList.toggle('hidden', !access.can_close_accounts);
            document.getElementById('command-builder').classList.toggle('hidden', !access.can_create_orders);
            document.getElementById('order-cart').classList.toggle('hidden', !access.can_create_orders);
            const [{ data: productData, error: productError }, { data: tableData, error: tableError }] = await Promise.all([
                db.from('products').select('*').eq('restaurant_id', access.restaurant_id).eq('is_available', true).order('category').order('name'),
                db.from('restaurant_tables').select('*').eq('restaurant_id', access.restaurant_id).eq('is_active', true).order('name')
            ]);
            if (productError || tableError) return alert('No se pudo cargar el punto de venta. Aplica primero la migración 004 en Supabase.');
            products = productData || []; tables = tableData || [];
            document.getElementById('category-filter').innerHTML += [...new Set(products.map(p => p.category))].map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
            document.getElementById('table-select').innerHTML += tables.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
            if (!tables.length) setService('pickup');
            await loadOpenAccounts();
            renderProducts(); renderCart();
            if (access.can_close_accounts) loadPendingOrders();
            if (access.can_create_orders) {
                loadReadyOrders();
                activateWaiterRealtime();
            }
        }

        function renderProducts() {
            const query = document.getElementById('product-search').value.trim().toLowerCase();
            const category = document.getElementById('category-filter').value;
            const visible = products.filter(p => (!category || p.category === category) && (!query || `${p.name} ${p.category}`.toLowerCase().includes(query)));
            document.getElementById('product-grid').innerHTML = visible.length ? visible.map(p => `
                <button onclick="addProduct('${p.id}')" class="bg-white rounded-3xl border border-slate-200 p-4 text-left hover:border-orange-400 hover:shadow-md">
                    <img src="${esc(window.serveYourself.safeImageUrl(p.image_url) || 'logo.png')}" class="w-full h-32 object-cover rounded-2xl bg-slate-100" alt="">
                    <p class="text-[10px] uppercase tracking-wider font-black text-orange-500 mt-3">${esc(p.category)}</p><h3 class="font-black mt-1">${esc(p.name)}</h3><p class="font-black text-lg mt-2">$${Number(p.price).toFixed(2)}</p>
                </button>`).join('') : '<p class="text-slate-400 col-span-full text-center py-16">No hay productos disponibles.</p>';
        }
        function addProduct(id) { cart.set(id, (cart.get(id) || 0) + 1); renderCart(); }
        function changeQty(id, delta) { const qty = (cart.get(id) || 0) + delta; qty > 0 ? cart.set(id, qty) : cart.delete(id); renderCart(); }
        function renderCart() {
            const entries = [...cart.entries()];
            document.getElementById('cart-items').innerHTML = entries.length ? entries.map(([id, qty]) => {
                const p = products.find(item => item.id === id); return `<div class="flex gap-3 items-center"><div class="flex-1"><p class="font-black text-sm">${esc(p.name)}</p><p class="text-xs text-slate-400">$${Number(p.price).toFixed(2)} c/u</p></div><button onclick="changeQty('${id}',-1)" class="w-9 h-9 rounded-lg bg-slate-100 font-black">−</button><b>${qty}</b><button onclick="changeQty('${id}',1)" class="w-9 h-9 rounded-lg bg-orange-100 text-orange-600 font-black">+</button></div>`;
            }).join('') : '<p class="text-center text-slate-400 py-8">Agrega productos al pedido.</p>';
            const total = entries.reduce((sum, [id, qty]) => sum + Number(products.find(p => p.id === id).price) * qty, 0);
            document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
        }
        function setService(type) {
            serviceType = type;
            document.querySelectorAll('.service-btn').forEach(btn => {
                const active = btn.dataset.service === type;
                btn.className = `service-btn p-3 rounded-xl font-black ${active ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`;
            });
            document.getElementById('table-wrap').classList.toggle('hidden', type !== 'dine_in');
        }
        async function submitOrder() {
            if (!cart.size) return alert('Agrega al menos un producto.');
            const tableId = document.getElementById('table-select').value;
            const selectedAccount = Number(document.getElementById('open-account').value || 0);
            if (!selectedAccount && serviceType === 'dine_in' && !tableId) return alert('Selecciona una mesa.');
            const button = document.getElementById('submit-order'); button.disabled = true; button.textContent = 'REGISTRANDO...';
            const request = selectedAccount
                ? db.rpc('append_pos_order_items', { p_order_id: selectedAccount, p_items: [...cart].map(([id, qty]) => ({ id, qty })), p_notes: document.getElementById('order-notes').value })
                : db.rpc('create_pos_order', { p_restaurant_id: access.restaurant_id, p_items: [...cart].map(([id, qty]) => ({ id, qty })), p_notes: document.getElementById('order-notes').value, p_service_type: serviceType, p_table_id: serviceType === 'dine_in' ? Number(tableId) : null, p_payment_method: 'cash' });
            const { data, error } = await request;
            button.disabled = false; button.textContent = 'ENVIAR A COCINA';
            if (error) return alert(error.message);
            lastOrder = data;
            lastOrder.restaurant_tables = { name: tables.find(t => t.id === Number(lastOrder.table_id))?.name };
            resetCartOnClose = true;
            document.getElementById('success-order').textContent = `Pedido #${lastOrder.id} · $${Number(lastOrder.total).toFixed(2)}`;
            document.getElementById('success-title').textContent = selectedAccount ? 'Nueva ronda enviada a cocina' : 'Pedido enviado a cocina';
            document.getElementById('print-button').textContent = access.can_close_accounts ? 'IMPRIMIR PRECUENTA' : 'IMPRIMIR COMANDA';
            document.getElementById('modal-payment-wrap').classList.toggle('hidden', !access.can_close_accounts);
            document.getElementById('charge-button').classList.toggle('hidden', !access.can_close_accounts);
            prepareTicket(lastOrder, !access.can_close_accounts);
            document.getElementById('success-modal').classList.remove('hidden'); document.getElementById('success-modal').classList.add('flex');
            if (access.can_close_accounts) loadPendingOrders();
            loadOpenAccounts();
        }
        async function loadOpenAccounts() {
            if (!access?.can_create_orders) return;
            const { data, error } = await db.from('orders').select('id,total,table_id,service_type,waiter_name,restaurant_tables(name)').eq('restaurant_id', access.restaurant_id).eq('order_source','pos').eq('payment_status','pending').neq('status','cancelado').order('created_at');
            if (error) return;
            openAccounts = data || [];
            document.getElementById('open-account').innerHTML = '<option value="">Nueva cuenta</option>' + openAccounts.map(o => `<option value="${o.id}">#${o.id} · ${o.service_type === 'dine_in' ? esc(o.restaurant_tables?.name || 'Mesa') : 'Para llevar'} · $${Number(o.total).toFixed(2)}</option>`).join('');
        }
        function prepareTicket(order, commandOnly = false) {
            const paid = order.payment_status === 'approved';
            const location = order.service_type === 'dine_in' ? esc(order.restaurant_tables?.name || 'Mesa') : 'Para llevar';
            const items = order.items.map(i => `<div class="ticket-row"><span>${Number(i.qty)} x ${esc(i.nombre)}</span>${commandOnly ? '' : `<span>$${(Number(i.price) * Number(i.qty)).toFixed(2)}</span>`}</div>`).join('');
            const payment = commandOnly ? '' : `<hr><div class="ticket-row ticket-total"><span>TOTAL</span><span>$${Number(order.total).toFixed(2)}</span></div><p>${paid ? `Pago: ${paymentLabels[order.payment_method]}` : 'Pago pendiente'}</p>`;
            document.getElementById('print-ticket').innerHTML = `<div class="ticket"><h1>${esc(access.business_name)}</h1><p class="ticket-payment-status">${commandOnly ? 'COMANDA' : (paid ? 'PAGADO' : 'PRECUENTA · PENDIENTE DE PAGO')}</p><p>Pedido #${order.id}</p><p>${new Date(order.created_at).toLocaleString('es-MX')}</p><hr><p><b>${location}</b></p>${items}${payment}${order.notes ? `<p>Nota: ${esc(order.notes)}</p>` : ''}${order.waiter_name ? `<p>Mesero: ${esc(order.waiter_name)}</p>` : ''}${paid && !commandOnly ? '<p class="ticket-thanks">¡Gracias por su compra!</p>' : ''}</div>`;
        }
        async function loadPendingOrders() {
            if (!access?.can_close_accounts) return;
            const { data, error } = await db.from('orders').select('*, restaurant_tables(name)').eq('restaurant_id', access.restaurant_id).eq('order_source', 'pos').eq('payment_status', 'pending').neq('status', 'cancelado').order('created_at');
            if (error) return;
            pendingOrders = data || [];
            document.getElementById('pending-count').textContent = pendingOrders.length;
            document.getElementById('pending-orders').innerHTML = pendingOrders.length ? pendingOrders.map(order => `<article class="bg-white border border-amber-200 rounded-2xl p-4"><div class="flex justify-between gap-3"><div><b>Pedido #${order.id}</b><p class="text-xs text-slate-500">${order.service_type === 'dine_in' ? esc(order.restaurant_tables?.name || 'Mesa') : 'Para llevar'}</p></div><strong>$${Number(order.total).toFixed(2)}</strong></div><select id="pending-method-${order.id}" class="w-full mt-3 p-2 rounded-xl border border-slate-200 text-sm font-bold"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option><option value="card_terminal">Tarjeta · terminal</option></select><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="printPending(${order.id})" class="p-2 rounded-xl bg-slate-100 text-xs font-black">PRECUENTA</button><button onclick="chargePending(${order.id})" class="p-2 rounded-xl bg-green-600 text-white text-xs font-black">COBRAR</button></div></article>`).join('') : '<p class="text-sm text-amber-700">No hay cuentas pendientes.</p>';
        }
        async function loadReadyOrders() {
            if (!access?.can_create_orders) return;
            const { data, error } = await db.from('orders').select('id, table_id, service_type, created_at, ready_at, restaurant_tables(name)').eq('restaurant_id', access.restaurant_id).eq('created_by', access.user.id).eq('status', 'listo').order('ready_at');
            if (error) return;
            const readyOrders = data || [];
            document.getElementById('ready-panel').classList.toggle('hidden', !readyOrders.length);
            document.getElementById('ready-count').textContent = readyOrders.length;
            document.getElementById('ready-orders').innerHTML = readyOrders.map(order => `<article class="bg-white border border-green-200 rounded-2xl p-4"><div class="flex items-center justify-between gap-3"><div><b class="text-lg">Pedido #${order.id}</b><p class="text-sm text-green-700 font-bold">${order.service_type === 'dine_in' ? esc(order.restaurant_tables?.name || 'Mesa') : 'Para llevar'}</p></div><span class="text-2xl">✅</span></div></article>`).join('');
        }
        function activateWaiterRealtime() {
            db.channel(`waiter-ready-${access.user.id}`).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders', filter: `restaurant_id=eq.${access.restaurant_id}` }, payload => {
                if (payload.new.created_by === access.user.id && payload.new.status === 'listo' && payload.old.status !== 'listo') {
                    showReadyAlert(payload.new);
                }
                loadReadyOrders();
            }).subscribe();
        }
        function showReadyAlert(order) {
            const alertBox = document.getElementById('ready-alert');
            alertBox.innerHTML = `<p class="text-xs font-black uppercase tracking-wider">Pedido listo</p><p class="font-black text-lg mt-1">La comanda #${order.id} está lista para entregar.</p>`;
            alertBox.classList.remove('hidden');
            document.getElementById('ready-sound').play().catch(() => {});
            setTimeout(() => alertBox.classList.add('hidden'), 8000);
        }
        function printPending(id) { const order = pendingOrders.find(item => item.id === id); if (!order) return; prepareTicket(order); printTicket(); }
        async function chargePending(id) { const method = document.getElementById(`pending-method-${id}`).value; await chargeOrder(id, method, false); }
        async function chargeLastOrder() { if (lastOrder) await chargeOrder(lastOrder.id, document.getElementById('modal-payment-method').value, true); }
        async function chargeOrder(id, method, showModal) {
            const sourceOrder = lastOrder?.id === id ? lastOrder : pendingOrders.find(item => item.id === id);
            const { data: existingPayments } = await db.from('order_payments').select('amount').eq('order_id', id);
            const remaining = Math.max(0, Number(sourceOrder?.total || 0) - (existingPayments || []).reduce((sum, payment) => sum + Number(payment.amount), 0));
            const { data, error } = await db.rpc('register_pos_payment', { p_order_id: id, p_payment_method: method, p_amount: remaining, p_tip: 0 });
            if (error) return alert(error.message);
            const previous = sourceOrder;
            lastOrder = { ...previous, ...data, restaurant_tables: previous?.restaurant_tables };
            prepareTicket(lastOrder); loadPendingOrders();
            if (showModal) {
                document.getElementById('success-title').textContent = 'Pago registrado';
                document.getElementById('success-order').textContent = `Pedido #${lastOrder.id} · $${Number(lastOrder.total).toFixed(2)} · ${paymentLabels[method]}`;
                document.getElementById('print-button').textContent = 'IMPRIMIR COMPROBANTE';
                document.getElementById('modal-payment-wrap').classList.add('hidden');
                document.getElementById('charge-button').classList.add('hidden');
            } else {
                alert(`Pedido #${id} marcado como pagado.`);
            }
        }
        function printTicket() { window.print(); }
        function closeSuccess() { if (resetCartOnClose) { cart.clear(); document.getElementById('order-notes').value = ''; renderCart(); resetCartOnClose = false; } document.getElementById('success-modal').classList.add('hidden'); document.getElementById('success-modal').classList.remove('flex'); }
        document.querySelectorAll('.service-btn').forEach(btn => btn.addEventListener('click', () => setService(btn.dataset.service)));
        document.getElementById('product-search').addEventListener('input', renderProducts); document.getElementById('category-filter').addEventListener('change', renderProducts);
        document.getElementById('clear-cart').addEventListener('click', () => { cart.clear(); renderCart(); }); document.getElementById('submit-order').addEventListener('click', submitOrder);
        init();
    </script>
</body>
</html>
