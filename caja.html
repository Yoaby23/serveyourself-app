<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caja y cuentas | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head>
<body class="bg-slate-50 min-h-screen"><header class="bg-white border-b border-slate-200 sticky top-0 z-30"><div class="max-w-6xl mx-auto p-4 flex items-center justify-between"><div><p class="text-xs font-black text-emerald-600 uppercase tracking-widest">Operación</p><h1 class="text-xl font-black">Caja y cuentas</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></div></header>
<main class="max-w-6xl mx-auto p-4 space-y-5">
<section id="shift-card" class="bg-slate-900 text-white rounded-3xl p-6"></section>
<section id="movement-card" class="hidden bg-white rounded-3xl border border-slate-200 p-5"><div class="flex justify-between items-center"><div><h2 class="font-black text-lg">Movimientos de caja</h2><p class="text-sm text-slate-500">Entradas, gastos y retiros del turno.</p></div></div><form id="movement-form" class="grid sm:grid-cols-[150px_140px_1fr_auto] gap-2 mt-4"><select id="movement-type" class="p-3 rounded-xl border font-bold"><option value="income">Entrada</option><option value="expense">Salida / gasto</option></select><input id="movement-amount" type="number" min="0.01" step="0.01" required placeholder="$0.00" class="p-3 rounded-xl border"><input id="movement-reason" required maxlength="200" placeholder="Motivo" class="p-3 rounded-xl border"><button class="px-5 rounded-xl bg-slate-900 text-white font-black">REGISTRAR</button></form><div id="movement-list" class="mt-4 space-y-2"></div></section>
<section class="bg-white rounded-3xl border border-blue-200 p-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="font-black text-xl">Pagos en línea por confirmar</h2><p class="text-sm text-slate-500">Estos pedidos no llegan a cocina hasta que Mercado Pago confirme el cobro.</p></div><span class="px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-black">LÍMITE: 20 MIN</span></div><div id="online-orders" class="grid lg:grid-cols-2 gap-4 mt-5"></div></section>
<section class="bg-white rounded-3xl border border-slate-200 p-5"><div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="font-black text-xl">Cuentas abiertas</h2><p class="text-sm text-slate-500">Precuenta, abonos, propina, cupones, traslado y cancelación.</p></div><button onclick="loadAll()" class="px-4 py-2 rounded-xl bg-slate-100 font-black">↻ Actualizar</button></div><div id="accounts" class="grid lg:grid-cols-2 gap-4 mt-5"></div></section>
</main><section id="print-ticket" class="ticket-print" aria-hidden="true"></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;let access,shift=null,accounts=[],onlineOrders=[],payments=[],movements=[],tables=[],waiters=[];const labels={cash:'Efectivo',transfer:'Transferencia',card_terminal:'Terminal'};
async function init(){access=await window.serveYourself.requireRestaurantPermission('can_close_accounts');if(!access)return;window.serveYourself.renderRestaurantNavigation(access);await loadAll();db.channel(`cash-${access.restaurant_id}`).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:`restaurant_id=eq.${access.restaurant_id}`},loadAll).subscribe();setInterval(loadAll,30000);}
async function loadAll(){await db.rpc('expire_unpaid_online_orders',{p_restaurant_id:access.restaurant_id});const since=new Date(Date.now()-24*60*60*1000).toISOString();const [s,o,q,p,m,t,w]=await Promise.all([db.from('cash_shifts').select('*').eq('restaurant_id',access.restaurant_id).order('opened_at',{ascending:false}).limit(1),db.from('orders').select('*, restaurant_tables(name)').eq('restaurant_id',access.restaurant_id).eq('order_source','pos').eq('payment_status','pending').neq('status','cancelado').order('created_at'),db.from('orders').select('*').eq('restaurant_id',access.restaurant_id).eq('payment_method','mercado_pago').in('payment_status',['pending','expired']).gte('created_at',since).order('created_at',{ascending:false}),db.from('order_payments').select('*').eq('restaurant_id',access.restaurant_id).order('created_at'),db.from('cash_movements').select('*').eq('restaurant_id',access.restaurant_id).order('created_at',{ascending:false}).limit(30),db.from('restaurant_tables').select('*').eq('restaurant_id',access.restaurant_id).eq('is_active',true).order('name'),db.rpc('list_available_waiters',{p_restaurant_id:access.restaurant_id})]);if([s,o,q,p,m,t,w].some(x=>x.error))return alert('Aplica las migraciones 008 y 010 en Supabase.');shift=s.data?.find(x=>x.status==='open')||null;accounts=o.data||[];onlineOrders=q.data||[];payments=p.data||[];movements=m.data||[];tables=t.data||[];waiters=w.data||[];render();}
function money(v){return `$${Number(v||0).toFixed(2)}`}
function paid(id){return payments.filter(p=>p.order_id===id).reduce((a,p)=>a+Number(p.amount),0)}
function render(){document.getElementById('movement-card').classList.toggle('hidden',!shift);document.getElementById('shift-card').innerHTML=shift?`<div class="flex flex-wrap justify-between gap-4"><div><p class="text-xs uppercase font-black text-emerald-400">Turno abierto</p><h2 class="text-2xl font-black mt-1">Desde ${new Date(shift.opened_at).toLocaleString('es-MX')}</h2><p class="text-slate-300 mt-2">Fondo inicial: ${money(shift.opening_cash)}</p></div><div class="flex gap-2 items-end"><button onclick="printCut()" class="px-4 py-3 rounded-xl bg-white/10 font-black">CORTE PREVIO</button><button onclick="closeShift()" class="px-4 py-3 rounded-xl bg-red-500 font-black">CERRAR TURNO</button></div></div>`:`<div class="flex flex-wrap justify-between gap-4 items-end"><div><p class="text-xs uppercase font-black text-orange-400">Caja cerrada</p><h2 class="text-2xl font-black mt-1">Abre un turno para controlar el efectivo</h2></div><div><label class="text-xs font-black uppercase text-slate-300">Fondo inicial<input id="opening-cash" type="number" min="0" step="0.01" value="0" class="block mt-2 p-3 rounded-xl text-slate-900"></label><button onclick="openShift()" class="mt-2 w-full py-3 rounded-xl bg-emerald-500 font-black">ABRIR CAJA</button></div></div>`;renderMovements();renderOnlineOrders();renderAccounts();}
function renderMovements(){document.getElementById('movement-list').innerHTML=shift?movements.filter(m=>m.shift_id===shift.id).map(m=>`<div class="flex justify-between p-3 rounded-xl bg-slate-50"><span><b>${m.movement_type==='income'?'Entrada':'Salida'}</b> · ${esc(m.reason)}</span><strong class="${m.movement_type==='income'?'text-green-600':'text-red-500'}">${m.movement_type==='income'?'+':'−'}${money(m.amount)}</strong></div>`).join('')||'<p class="text-sm text-slate-400">Sin movimientos.</p>':'';}
function accountCard(o){const subtotal=paid(o.id),remaining=Math.max(0,Number(o.total)-subtotal);const tableOptions=`<option value="">Para llevar</option>`+tables.map(t=>`<option value="${t.id}" ${t.id===o.table_id?'selected':''}>${esc(t.name)}</option>`).join(''),waiterOptions=`<option value="">Conservar mesero</option>`+waiters.map(w=>`<option value="${w.user_id}">${esc(w.full_name||w.staff_role)}</option>`).join('');return `<article class="border rounded-2xl p-4"><div class="flex justify-between"><div><b class="text-lg">Cuenta #${o.id}</b><p class="text-sm text-slate-500">${o.service_type==='dine_in'?esc(o.restaurant_tables?.name||'Mesa'):'Para llevar'} · ${esc(o.waiter_name||'Sin mesero')}</p></div><div class="text-right"><strong class="text-xl">${money(o.total)}</strong><p class="text-xs text-orange-600 font-black">Saldo ${money(remaining)}</p></div></div><div class="mt-3 text-sm bg-slate-50 p-3 rounded-xl">${o.items.map(i=>`<p>${Number(i.qty)}× ${esc(i.nombre)}</p>`).join('')}</div><div class="grid grid-cols-3 gap-2 mt-3"><select id="method-${o.id}" class="p-2 border rounded-xl font-bold"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option><option value="card_terminal">Terminal</option></select><input id="amount-${o.id}" type="number" step="0.01" min="0.01" value="${remaining.toFixed(2)}" class="p-2 border rounded-xl" title="Abono"><input id="tip-${o.id}" type="number" step="0.01" min="0" value="0" class="p-2 border rounded-xl" title="Propina"></div><button onclick="pay(${o.id})" class="w-full mt-2 py-3 rounded-xl bg-emerald-600 text-white font-black">REGISTRAR PAGO</button><div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mt-2"><button onclick="printAccount(${o.id})" class="p-2 rounded-xl bg-slate-100 text-xs font-black">PRECUENTA</button><button onclick="splitAccount(${o.id})" class="p-2 rounded-xl bg-orange-50 text-orange-700 text-xs font-black">DIVIDIR</button><button onclick="coupon(${o.id})" class="p-2 rounded-xl bg-purple-50 text-purple-700 text-xs font-black">CUPÓN</button><button onclick="transfer(${o.id})" class="p-2 rounded-xl bg-blue-50 text-blue-700 text-xs font-black">MOVER</button><button onclick="cancelAccount(${o.id})" class="p-2 rounded-xl bg-red-50 text-red-600 text-xs font-black">CANCELAR</button></div><div class="grid grid-cols-2 gap-2 mt-2"><select id="table-${o.id}" class="p-2 border rounded-xl text-sm">${tableOptions}</select><select id="waiter-${o.id}" class="p-2 border rounded-xl text-sm">${waiterOptions}</select></div></article>`;}
function renderAccounts(){document.getElementById('accounts').innerHTML=accounts.length?accounts.map(accountCard).join(''):'<p class="text-slate-400 py-8">No hay cuentas pendientes.</p>';}
function onlineTimeLeft(o){const end=new Date(o.payment_expires_at||new Date(o.created_at).getTime()+20*60000).getTime(),seconds=Math.max(0,Math.ceil((end-Date.now())/1000));return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;}
function renderOnlineOrders(){document.getElementById('online-orders').innerHTML=onlineOrders.length?onlineOrders.map(o=>{const expired=o.payment_status==='expired',processing=!expired&&Boolean(o.mercado_pago_payment_id);return `<article class="border ${expired?'border-red-200 bg-red-50':'border-blue-200 bg-blue-50'} rounded-2xl p-4"><div class="flex justify-between gap-3"><div><b>Pedido en línea #${o.id}</b><p class="text-sm text-slate-500">${esc(o.restaurant_name||'Pedido web')} · ${new Date(o.created_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</p></div><strong>${money(o.total)}</strong></div><div class="mt-3 text-sm">${o.items.map(i=>`<p>${Number(i.qty)}× ${esc(i.nombre)}</p>`).join('')}</div><p class="mt-3 text-xs font-black uppercase ${expired?'text-red-600':'text-blue-700'}">${expired?'Pago vencido · debe crear otro pedido':processing?'Mercado Pago está procesando el cobro':`Esperando pago · ${onlineTimeLeft(o)}`}</p>${expired?'':`<button onclick="verifyOnlinePayment(${o.id},this)" class="w-full mt-3 py-3 rounded-xl bg-blue-600 text-white font-black">VERIFICAR PAGO</button>`}</article>`;}).join(''):'<p class="text-slate-400 py-5">No hay pagos en línea pendientes.</p>';}
async function verifyOnlinePayment(id,button){const text=button.textContent;button.disabled=true;button.textContent='VERIFICANDO…';try{const response=await window.serveYourself.reconcileMercadoPagoOrder(id);if(!response.ok)throw new Error('Mercado Pago aún no confirma el cobro.');await loadAll();}catch(error){alert(error.message);}finally{button.disabled=false;button.textContent=text;}}
async function openShift(){const amount=Number(document.getElementById('opening-cash').value);const{error}=await db.rpc('open_cash_shift',{p_restaurant_id:access.restaurant_id,p_opening_cash:amount});if(error)return alert(error.message);loadAll();}
async function closeShift(){const counted=prompt('¿Cuánto efectivo contaste físicamente en caja?');if(counted===null)return;const notes=prompt('Notas del cierre (opcional)')||'';const{data,error}=await db.rpc('close_cash_shift',{p_restaurant_id:access.restaurant_id,p_counted_cash:Number(counted),p_notes:notes});if(error)return alert(error.message);alert(`Turno cerrado. Esperado: ${money(data.expected_cash)} · Diferencia: ${money(data.difference)}`);loadAll();}
document.getElementById('movement-form').addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.rpc('add_cash_movement',{p_restaurant_id:access.restaurant_id,p_type:document.getElementById('movement-type').value,p_amount:Number(document.getElementById('movement-amount').value),p_reason:document.getElementById('movement-reason').value});if(error)return alert(error.message);e.target.reset();loadAll();});
async function pay(id){const{error}=await db.rpc('register_pos_payment',{p_order_id:id,p_payment_method:document.getElementById(`method-${id}`).value,p_amount:Number(document.getElementById(`amount-${id}`).value),p_tip:Number(document.getElementById(`tip-${id}`).value||0)});if(error)return alert(error.message);loadAll();}
async function coupon(id){const code=prompt('Código del cupón');if(!code)return;const{error}=await db.rpc('apply_order_coupon',{p_order_id:id,p_code:code});if(error)return alert(error.message);loadAll();}
async function transfer(id){const value=document.getElementById(`table-${id}`).value,waiter=document.getElementById(`waiter-${id}`).value;const{error}=await db.rpc('transfer_pos_order',{p_order_id:id,p_table_id:value?Number(value):null,p_waiter_id:waiter||null});if(error)return alert(error.message);loadAll();}
async function splitAccount(id){const order=accounts.find(o=>o.id===id),selected=[];for(const item of order.items){const qty=prompt(`Cantidad de “${item.nombre}” que irá a la cuenta separada (0 a ${item.qty})`,'0');if(qty===null)return;const number=Number(qty);if(number>0)selected.push({id:item.id,qty:number});}if(!selected.length)return alert('No seleccionaste productos.');const{error}=await db.rpc('split_pos_order',{p_order_id:id,p_items:selected});if(error)return alert(error.message);loadAll();}
async function cancelAccount(id){const reason=prompt('Motivo obligatorio de cancelación');if(!reason)return;const{error}=await db.rpc('cancel_pos_order',{p_order_id:id,p_reason:reason});if(error)return alert(error.message);loadAll();}
function printAccount(id){const o=accounts.find(x=>x.id===id);document.getElementById('print-ticket').innerHTML=`<div class="ticket"><h1>${esc(access.business_name)}</h1><p class="ticket-payment-status">PRECUENTA</p><p>Cuenta #${o.id}</p><p>${o.service_type==='dine_in'?esc(o.restaurant_tables?.name||'Mesa'):'Para llevar'}</p><hr>${o.items.map(i=>`<div class="ticket-row"><span>${i.qty} x ${esc(i.nombre)}</span><span>${money(Number(i.price)*Number(i.qty))}</span></div>`).join('')}<hr><div class="ticket-row ticket-total"><span>TOTAL</span><span>${money(o.total)}</span></div><p>Saldo pendiente: ${money(Number(o.total)-paid(o.id))}</p></div>`;window.print();}
function printCut(){const shiftPayments=payments.filter(p=>p.shift_id===shift.id);const total=shiftPayments.reduce((a,p)=>a+Number(p.amount),0);document.getElementById('print-ticket').innerHTML=`<div class="ticket"><h1>${esc(access.business_name)}</h1><p class="ticket-payment-status">CORTE PREVIO</p><p>${new Date().toLocaleString('es-MX')}</p><hr>${Object.keys(labels).map(k=>`<div class="ticket-row"><span>${labels[k]}</span><span>${money(shiftPayments.filter(p=>p.payment_method===k).reduce((a,p)=>a+Number(p.amount),0))}</span></div>`).join('')}<hr><div class="ticket-row ticket-total"><span>VENTAS</span><span>${money(total)}</span></div></div>`;window.print();}
init();
</script></body></html>
