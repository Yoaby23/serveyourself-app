<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Caja y cuentas | ServeYourself</title>
    <link rel="icon" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 min-h-screen cashier-page">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto p-4 flex items-center justify-between">
            <div><p class="text-xs font-black text-emerald-600 uppercase tracking-widest">Operación</p><h1 class="text-xl font-black">Caja y cuentas</h1></div>
            <div id="restaurant-nav" class="sy-restaurant-nav"></div>
        </div>
    </header>
    <main class="max-w-6xl mx-auto p-4 space-y-5">
        <section id="shift-card" class="bg-slate-900 text-white rounded-3xl p-6"></section>
        <section id="movement-card" class="hidden bg-white rounded-3xl border border-slate-200 p-5">
            <h2 class="font-black text-lg">Movimientos de caja</h2><p class="text-sm text-slate-500">Entradas, gastos y retiros del turno.</p>
            <form id="movement-form" class="cash-movement-form mt-4"><select id="movement-type" class="p-3 rounded-xl border font-bold"><option value="income">Entrada</option><option value="expense">Salida / gasto</option></select><input id="movement-amount" type="number" min="0.01" step="0.01" required placeholder="$0.00" class="p-3 rounded-xl border"><input id="movement-reason" required maxlength="200" placeholder="Motivo" class="p-3 rounded-xl border"><button class="px-5 py-3 rounded-xl bg-slate-900 text-white font-black">REGISTRAR</button></form>
            <div id="movement-list" class="mt-4 space-y-2"></div>
        </section>
        <section class="bg-white rounded-3xl border border-blue-200 p-5">
            <div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="font-black text-xl">Pagos en línea por confirmar</h2><p class="text-sm text-slate-500">No llegan a cocina hasta que Mercado Pago confirme el cobro.</p></div><span class="px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-black">LÍMITE: 20 MIN</span></div>
            <div id="online-orders" class="grid lg:grid-cols-2 gap-4 mt-5"></div>
        </section>
        <section class="bg-white rounded-3xl border border-slate-200 p-5">
            <div class="flex flex-wrap justify-between items-center gap-3"><div><h2 class="font-black text-xl">Cuentas abiertas</h2><p class="text-sm text-slate-500">Cobra, calcula el cambio, imprime la cuenta o administra el consumo.</p></div><button onclick="loadAll()" class="px-4 py-2 rounded-xl bg-slate-100 font-black">↻ Actualizar</button></div>
            <div id="accounts" class="grid xl:grid-cols-2 gap-4 mt-5"></div>
        </section>
    </main>
    <section id="print-ticket" class="ticket-print" aria-hidden="true"></section>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script>
    <script>
        const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;
        let access,shift=null,accounts=[],onlineOrders=[],payments=[],movements=[],tables=[],waiters=[];
        const labels={cash:'Efectivo',transfer:'Transferencia',card_terminal:'Terminal'},money=v=>`$${Number(v||0).toFixed(2)}`;
        async function init(){access=await window.serveYourself.requireRestaurantPermission('can_close_accounts');if(!access)return;window.serveYourself.renderRestaurantNavigation(access,{showBack:false});await loadAll();db.channel(`cash-${access.restaurant_id}`).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:`restaurant_id=eq.${access.restaurant_id}`},loadAll).subscribe();setInterval(()=>{if(!document.hidden)loadAll()},30000)}
        async function loadAll(){await db.rpc('expire_unpaid_online_orders',{p_restaurant_id:access.restaurant_id});const since=new Date(Date.now()-86400000).toISOString();const[s,o,q,p,m,t,w]=await Promise.all([db.from('cash_shifts').select('*').eq('restaurant_id',access.restaurant_id).order('opened_at',{ascending:false}).limit(1),db.from('orders').select('*, restaurant_tables(name)').eq('restaurant_id',access.restaurant_id).eq('order_source','pos').eq('payment_status','pending').neq('status','cancelado').order('created_at'),db.from('orders').select('*').eq('restaurant_id',access.restaurant_id).eq('payment_method','mercado_pago').in('payment_status',['pending','expired']).gte('created_at',since).order('created_at',{ascending:false}),db.from('order_payments').select('*').eq('restaurant_id',access.restaurant_id).order('created_at'),db.from('cash_movements').select('*').eq('restaurant_id',access.restaurant_id).order('created_at',{ascending:false}).limit(30),db.from('restaurant_tables').select('*').eq('restaurant_id',access.restaurant_id).eq('is_active',true).order('name'),db.rpc('list_available_waiters',{p_restaurant_id:access.restaurant_id})]);if([s,o,q,p,m,t,w].some(x=>x.error))return alert('No se pudo sincronizar Caja. Verifica que las migraciones estén aplicadas.');shift=s.data?.find(x=>x.status==='open')||null;accounts=o.data||[];onlineOrders=q.data||[];payments=p.data||[];movements=m.data||[];tables=t.data||[];waiters=w.data||[];render()}
        function paid(id){return payments.filter(p=>p.order_id===id).reduce((a,p)=>a+Number(p.amount),0)}
        function render(){document.getElementById('movement-card').classList.toggle('hidden',!shift);document.getElementById('shift-card').innerHTML=shift?`<div class="flex flex-wrap justify-between gap-4"><div><p class="text-xs uppercase font-black text-emerald-400">Turno abierto</p><h2 class="text-2xl font-black mt-1">Desde ${new Date(shift.opened_at).toLocaleString('es-MX')}</h2><p class="text-slate-300 mt-2">Fondo inicial: ${money(shift.opening_cash)}</p></div><div class="flex flex-wrap gap-2 items-end"><button onclick="printCut()" class="px-4 py-3 rounded-xl bg-white/10 font-black">CORTE PREVIO</button><button onclick="closeShift()" class="px-4 py-3 rounded-xl bg-red-500 font-black">CERRAR TURNO</button></div></div>`:`<div class="flex flex-wrap justify-between gap-4 items-end"><div><p class="text-xs uppercase font-black text-orange-400">Caja cerrada</p><h2 class="text-2xl font-black mt-1">Abre un turno para controlar el efectivo</h2></div><div><label class="text-xs font-black uppercase text-slate-300">Fondo inicial<input id="opening-cash" type="number" min="0" step="0.01" value="0" class="block mt-2 p-3 rounded-xl text-slate-900"></label><button onclick="openShift()" class="mt-2 w-full py-3 rounded-xl bg-emerald-500 font-black">ABRIR CAJA</button></div></div>`;renderMovements();renderOnlineOrders();renderAccounts()}
        function renderMovements(){document.getElementById('movement-list').innerHTML=shift?movements.filter(m=>m.shift_id===shift.id).map(m=>`<div class="flex justify-between gap-3 p-3 rounded-xl bg-slate-50"><span><b>${m.movement_type==='income'?'Entrada':'Salida'}</b> · ${esc(m.reason)}</span><strong class="${m.movement_type==='income'?'text-green-600':'text-red-500'}">${m.movement_type==='income'?'+':'−'}${money(m.amount)}</strong></div>`).join('')||'<p class="text-sm text-slate-400">Sin movimientos.</p>':''}
        function accountCard(o){const remaining=Math.max(0,Number(o.total)-paid(o.id)),tableOptions=`<option value="">Para llevar</option>`+tables.map(t=>`<option value="${t.id}" ${t.id===o.table_id?'selected':''}>${esc(t.name)}</option>`).join(''),waiterOptions=`<option value="">Conservar mesero</option>`+waiters.map(w=>`<option value="${w.user_id}">${esc(w.full_name||w.staff_role)}</option>`).join('');return `<article class="cash-account-card"><div class="flex justify-between gap-3"><div><b class="text-lg">Cuenta #${o.id}</b><p class="text-sm text-slate-500">${o.service_type==='dine_in'?esc(o.restaurant_tables?.name||'Mesa'):'Para llevar'} · ${esc(o.waiter_name||'Sin mesero')}</p></div><div class="text-right"><strong class="text-xl">${money(o.total)}</strong><p class="text-xs text-orange-600 font-black">Saldo ${money(remaining)}</p></div></div><div class="mt-3 text-sm bg-slate-50 p-3 rounded-xl">${o.items.map(i=>`<p class="flex justify-between gap-3"><span>${Number(i.qty)}× ${esc(i.nombre)}</span><b>${money(Number(i.price)*Number(i.qty))}</b></p>`).join('')}</div><div class="payment-form mt-4"><label>Método<select id="method-${o.id}" onchange="paymentChanged(${o.id})"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option><option value="card_terminal">Terminal</option></select></label><label>Importe a cobrar<input id="amount-${o.id}" oninput="calculateChange(${o.id})" type="number" step="0.01" min="0.01" max="${remaining.toFixed(2)}" value="${remaining.toFixed(2)}"></label><label>Propina<input id="tip-${o.id}" oninput="calculateChange(${o.id})" type="number" step="0.01" min="0" value="0"></label><label id="received-wrap-${o.id}">Efectivo recibido<input id="received-${o.id}" oninput="calculateChange(${o.id})" type="number" step="0.01" min="0" value="${remaining.toFixed(2)}"></label></div><div id="change-${o.id}" class="cash-change is-zero"><span>Cambio a entregar</span><strong>$0.00</strong></div><button onclick="pay(${o.id},this)" class="w-full mt-3 py-3 rounded-xl bg-emerald-600 text-white font-black">REGISTRAR PAGO</button><div class="cash-actions mt-3"><button onclick="printAccount(${o.id})" class="cash-action cash-action-primary">🖨️ IMPRIMIR CUENTA</button><button onclick="splitAccount(${o.id})" class="cash-action">DIVIDIR</button><button onclick="coupon(${o.id})" class="cash-action">CUPÓN</button><button onclick="transfer(${o.id})" class="cash-action">MOVER</button><button onclick="cancelAccount(${o.id})" class="cash-action cash-action-danger">CANCELAR</button></div><div class="grid sm:grid-cols-2 gap-2 mt-3"><select id="table-${o.id}" class="p-3 border rounded-xl text-sm">${tableOptions}</select><select id="waiter-${o.id}" class="p-3 border rounded-xl text-sm">${waiterOptions}</select></div></article>`}
        function renderAccounts(){document.getElementById('accounts').innerHTML=accounts.length?accounts.map(accountCard).join(''):'<p class="text-slate-400 py-8">No hay cuentas pendientes.</p>'}
        function paymentChanged(id){const cash=document.getElementById(`method-${id}`).value==='cash';document.getElementById(`received-wrap-${id}`).classList.toggle('hidden',!cash);document.getElementById(`change-${id}`).classList.toggle('hidden',!cash);calculateChange(id)}
        function calculateChange(id){const amount=Math.max(0,Number(document.getElementById(`amount-${id}`).value||0)),tip=Math.max(0,Number(document.getElementById(`tip-${id}`).value||0)),received=Math.max(0,Number(document.getElementById(`received-${id}`).value||0)),change=received-amount-tip,box=document.getElementById(`change-${id}`);box.classList.toggle('is-short',change<0);box.classList.toggle('is-zero',change===0);box.querySelector('span').textContent=change<0?'Falta por recibir':'Cambio a entregar';box.querySelector('strong').textContent=money(Math.abs(change));return change}
        function onlineTimeLeft(o){const end=new Date(o.payment_expires_at||new Date(o.created_at).getTime()+1200000).getTime(),seconds=Math.max(0,Math.ceil((end-Date.now())/1000));return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
        function renderOnlineOrders(){document.getElementById('online-orders').innerHTML=onlineOrders.length?onlineOrders.map(o=>{const expired=o.payment_status==='expired',processing=!expired&&Boolean(o.mercado_pago_payment_id);return `<article class="border ${expired?'border-red-200 bg-red-50':'border-blue-200 bg-blue-50'} rounded-2xl p-4"><div class="flex justify-between gap-3"><div><b>Pedido en línea #${o.id}</b><p class="text-sm text-slate-500">${esc(o.restaurant_name||'Pedido web')}</p></div><strong>${money(o.total)}</strong></div><p class="mt-3 text-xs font-black uppercase ${expired?'text-red-600':'text-blue-700'}">${expired?'Pago vencido · debe crear otro pedido':processing?'Mercado Pago está procesando el cobro':`Esperando pago · ${onlineTimeLeft(o)}`}</p>${expired?'':`<button onclick="verifyOnlinePayment(${o.id},this)" class="w-full mt-3 py-3 rounded-xl bg-blue-600 text-white font-black">VERIFICAR PAGO</button>`}</article>`}).join(''):'<p class="text-slate-400 py-5">No hay pagos en línea pendientes.</p>'}
        async function verifyOnlinePayment(id,button){const text=button.textContent;button.disabled=true;button.textContent='VERIFICANDO…';try{const response=await window.serveYourself.reconcileMercadoPagoOrder(id);if(!response.ok)throw new Error('Mercado Pago aún no confirma el cobro.');await loadAll()}catch(error){alert(error.message)}finally{button.disabled=false;button.textContent=text}}
        async function openShift(){const amount=Number(document.getElementById('opening-cash').value);const{error}=await db.rpc('open_cash_shift',{p_restaurant_id:access.restaurant_id,p_opening_cash:amount});if(error)return alert(error.message);loadAll()}
        async function closeShift(){const counted=prompt('¿Cuánto efectivo contaste físicamente en caja?');if(counted===null)return;const notes=prompt('Notas del cierre (opcional)')||'';const{data,error}=await db.rpc('close_cash_shift',{p_restaurant_id:access.restaurant_id,p_counted_cash:Number(counted),p_notes:notes});if(error)return alert(error.message);alert(`Turno cerrado. Esperado: ${money(data.expected_cash)} · Diferencia: ${money(data.difference)}`);loadAll()}
        document.getElementById('movement-form').addEventListener('submit',async e=>{e.preventDefault();const{error}=await db.rpc('add_cash_movement',{p_restaurant_id:access.restaurant_id,p_type:document.getElementById('movement-type').value,p_amount:Number(document.getElementById('movement-amount').value),p_reason:document.getElementById('movement-reason').value});if(error)return alert(error.message);e.target.reset();loadAll()})
        async function pay(id,button){const method=document.getElementById(`method-${id}`).value,amount=Number(document.getElementById(`amount-${id}`).value),tip=Number(document.getElementById(`tip-${id}`).value||0),received=method==='cash'?Number(document.getElementById(`received-${id}`).value):null;if(method==='cash'&&calculateChange(id)<0)return alert('El efectivo recibido no alcanza para cubrir el importe y la propina.');button.disabled=true;button.textContent='REGISTRANDO…';const{data,error}=await db.rpc('register_pos_payment_v2',{p_order_id:id,p_payment_method:method,p_amount:amount,p_tip:tip,p_cash_received:received});button.disabled=false;button.textContent='REGISTRAR PAGO';if(error)return alert(error.message);alert(method==='cash'?(Number(data.cash_change)>0?`Pago registrado. Entrega ${money(data.cash_change)} de cambio.`:'Pago exacto registrado. No es necesario dar cambio.'):'Pago registrado correctamente.');loadAll()}
        async function coupon(id){const code=prompt('Código del cupón');if(!code)return;const{error}=await db.rpc('apply_order_coupon',{p_order_id:id,p_code:code});if(error)return alert(error.message);loadAll()}
        async function transfer(id){const value=document.getElementById(`table-${id}`).value,waiter=document.getElementById(`waiter-${id}`).value;const{error}=await db.rpc('transfer_pos_order',{p_order_id:id,p_table_id:value?Number(value):null,p_waiter_id:waiter||null});if(error)return alert(error.message);loadAll()}
        async function splitAccount(id){const order=accounts.find(o=>o.id===id),selected=[];for(const item of order.items){const qty=prompt(`Cantidad de “${item.nombre}” para la cuenta separada (0 a ${item.qty})`,'0');if(qty===null)return;const number=Number(qty);if(number>0)selected.push({id:item.id,qty:number})}if(!selected.length)return alert('No seleccionaste productos.');const{error}=await db.rpc('split_pos_order',{p_order_id:id,p_items:selected});if(error)return alert(error.message);loadAll()}
        async function cancelAccount(id){const reason=prompt('Motivo obligatorio de cancelación');if(!reason)return;const{error}=await db.rpc('cancel_pos_order',{p_order_id:id,p_reason:reason});if(error)return alert(error.message);loadAll()}
        function printAccount(id){const o=accounts.find(x=>x.id===id),balance=Math.max(0,Number(o.total)-paid(o.id));document.getElementById('print-ticket').innerHTML=`<div class="ticket"><h1>${esc(access.business_name)}</h1><p class="ticket-payment-status">CUENTA</p><p>Cuenta #${o.id}</p><p>${o.service_type==='dine_in'?esc(o.restaurant_tables?.name||'Mesa'):'Para llevar'} · ${new Date().toLocaleString('es-MX')}</p><hr>${o.items.map(i=>`<div class="ticket-row"><span>${i.qty} x ${esc(i.nombre)}</span><span>${money(Number(i.price)*Number(i.qty))}</span></div>`).join('')}<hr><div class="ticket-row ticket-total"><span>TOTAL</span><span>${money(o.total)}</span></div>${paid(o.id)>0?`<div class="ticket-row"><span>Pagado</span><span>${money(paid(o.id))}</span></div>`:''}<div class="ticket-row"><b>SALDO</b><b>${money(balance)}</b></div><p class="ticket-thanks">Gracias por tu visita</p></div>`;window.print()}
        function printCut(){const shiftPayments=payments.filter(p=>p.shift_id===shift.id),total=shiftPayments.reduce((a,p)=>a+Number(p.amount),0);document.getElementById('print-ticket').innerHTML=`<div class="ticket"><h1>${esc(access.business_name)}</h1><p class="ticket-payment-status">CORTE PREVIO</p><p>${new Date().toLocaleString('es-MX')}</p><hr>${Object.keys(labels).map(k=>`<div class="ticket-row"><span>${labels[k]}</span><span>${money(shiftPayments.filter(p=>p.payment_method===k).reduce((a,p)=>a+Number(p.amount),0))}</span></div>`).join('')}<hr><div class="ticket-row ticket-total"><span>VENTAS</span><span>${money(total)}</span></div></div>`;window.print()}
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadAll()});window.addEventListener('pageshow',()=>{if(access)loadAll()});init();
    </script>
</body>
</html>
