<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro de repartidor | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head><body class="bg-slate-50 min-h-screen"><header class="bg-white border-b"><div class="max-w-xl mx-auto p-4 flex justify-center"><img src="logo.png" class="w-10 h-10 object-contain" alt=""><b class="self-center ml-2 text-xl">serve<span class="text-orange-500">yourself</span></b></div></header><main class="max-w-xl mx-auto p-4 py-10"><section class="bg-white border rounded-3xl p-6 shadow-sm"><p class="text-xs uppercase tracking-widest text-orange-500 font-black">Repartidores independientes</p><h1 class="text-3xl font-black mt-2">Trabaja con todos los restaurantes</h1><p class="text-slate-500 mt-2">Regístrate directamente en ServeYourself. Antes de aceptar cada pedido verás la distancia y cuánto ganarás.</p><form id="form" class="space-y-4 mt-7"><label class="block text-sm font-bold">Nombre completo<input id="name" required minlength="2" class="w-full mt-2 p-4 rounded-2xl border"></label><label class="block text-sm font-bold">Teléfono<input id="phone" required minlength="7" inputmode="tel" class="w-full mt-2 p-4 rounded-2xl border"></label><label class="block text-sm font-bold">Medio de reparto<select id="vehicle" class="w-full mt-2 p-4 rounded-2xl border"><option value="motorcycle">Motocicleta</option><option value="bicycle">Bicicleta</option><option value="car">Automóvil</option><option value="walking">A pie</option></select></label><label class="block text-sm font-bold">Placa (opcional)<input id="plate" maxlength="20" class="w-full mt-2 p-4 rounded-2xl border"></label><button id="submit" class="w-full py-4 rounded-2xl bg-orange-500 text-white font-black">GUARDAR Y CONTINUAR</button></form><a href="menu.html" class="block text-center mt-5 text-slate-500 font-bold">Volver a mis pedidos</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase;let user;async function init(){user=await window.serveYourself.requireUser();if(!user)return;const{data}=await db.rpc('get_delivery_driver_profile');if(data){document.getElementById('name').value=data.full_name||'';document.getElementById('phone').value=data.phone||'';document.getElementById('vehicle').value=data.vehicle_type||'motorcycle';document.getElementById('plate').value=data.vehicle_plate||''}}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;b.textContent='GUARDANDO...';const{error}=await db.rpc('register_delivery_driver',{p_full_name:document.getElementById('name').value,p_phone:document.getElementById('phone').value,p_vehicle_type:document.getElementById('vehicle').value,p_vehicle_plate:document.getElementById('plate').value});if(error){b.disabled=false;b.textContent='GUARDAR Y CONTINUAR';return alert(error.message)}location.replace('repartidor.html')});init();
</script></body></html>
