<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportes | ServeYourself</title><link rel="icon" href="logo.png"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="styles.css"></head><body class="report-page bg-slate-50 min-h-screen"><header class="bg-white border-b sticky top-0 z-30 no-print"><div class="max-w-6xl mx-auto p-4 flex justify-between items-center"><div><p class="text-xs font-black text-blue-600 uppercase tracking-widest">Inteligencia del negocio</p><h1 class="text-xl font-black">Reportes operativos</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></div></header>
<main class="max-w-6xl mx-auto p-4"><section class="no-print bg-white border rounded-2xl p-4 flex flex-wrap gap-3 items-end"><label class="text-xs font-black uppercase">Desde<input id="date-from" type="date" class="block mt-1 p-3 border rounded-xl"></label><label class="text-xs font-black uppercase">Hasta<input id="date-to" type="date" class="block mt-1 p-3 border rounded-xl"></label><button onclick="loadReport()" class="px-5 py-3 rounded-xl bg-slate-900 text-white font-black">ACTUALIZAR</button><button onclick="exportCsv()" class="px-5 py-3 rounded-xl bg-green-100 text-green-700 font-black">EXPORTAR CSV</button><button onclick="window.print()" class="px-5 py-3 rounded-xl bg-blue-100 text-blue-700 font-black">IMPRIMIR / PDF</button></section>
<section id="summary" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-5"></section><div class="grid lg:grid-cols-2 gap-5 mt-5"><section class="bg-white border rounded-3xl p-5"><h2 class="font-black text-lg">Ventas por método</h2><div id="payment-report" class="mt-4 space-y-3"></div></section><section class="bg-white border rounded-3xl p-5"><h2 class="font-black text-lg">Productos más vendidos</h2><div id="product-report" class="mt-4 space-y-3"></div></section><section class="bg-white border rounded-3xl p-5"><h2 class="font-black text-lg">Desempeño por mesero</h2><div id="waiter-report" class="mt-4 space-y-3"></div></section><section class="bg-white border rounded-3xl p-5"><h2 class="font-black text-lg">Delivery</h2><div id="delivery-report" class="mt-4 space-y-3"></div></section><section class="bg-white border rounded-3xl p-5"><h2 class="font-black text-lg">Control y excepciones</h2><div id="control-report" class="mt-4 space-y-3"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const db=window.serveYourself.supabase,esc=window.serveYourself.escapeHtml;let access,orders=[],payments=[],shifts=[],incidents=[];const labels={cash:'Efectivo',transfer:'Transferencia',card_terminal:'Terminal',mercado_pago:'Mercado Pago',mixed:'Mixto'};
async function init(){access=await window.serveYourself.requireRestaurantAccess(['owner']);if(!access)return;window.serveYourself.renderRestaurantNavigation(access);const now=new Date(),past=new Date();past.setDate(now.getDate()-30);document.getElementById('date-to').value=now.toISOString().slice(0,10);document.getElementById('date-from').value=past.toISOString().slice(0,10);loadReport();}
async function loadReport(){const from=`${document.getElementById('date-from').value}T00:00:00`,to=`${document.getElementById('date-to').value}T23:59:59`;const[o,p,s,i]=await Promise.all([db.from('orders').select('*').eq('restaurant_id',access.restaurant_id).gte('created_at',from).lte('created_at',to).order('created_at'),db.from('order_payments').select('*').eq('restaurant_id',access.restaurant_id).gte('created_at',from).lte('created_at',to),db.from('cash_shifts').select('*').eq('restaurant_id',access.restaurant_id).gte('opened_at',from).lte('opened_at',to),db.from('delivery_incidents').select('*').eq('restaurant_id',access.restaurant_id).gte('created_at',from).lte('created_at',to)]);if([o,p,s].some(x=>x.error))return alert('No se pudo cargar el reporte.');orders=o.data||[];payments=p.data||[];shifts=s.data||[];incidents=i.data||[];render();renderDelivery();}
const money=v=>`$${Number(v||0).toFixed(2)}`;function render(){const completed=orders.filter(o=>o.payment_status==='approved'),sales=completed.reduce((a,o)=>a+Number(o.total),0),tips=payments.reduce((a,p)=>a+Number(p.tip_amount),0),cancelled=orders.filter(o=>o.status==='cancelado').length;document.getElementById('summary').innerHTML=[['Ventas',money(sales),'text-green-600'],['Pedidos',completed.length,'text-blue-600'],['Ticket promedio',money(completed.length?sales/completed.length:0),'text-orange-600'],['Propinas',money(tips),'text-purple-600']].map(x=>`<article class="bg-white border rounded-2xl p-5"><p class="text-xs font-black uppercase text-slate-400">${x[0]}</p><b class="block text-3xl mt-2 ${x[2]}">${x[1]}</b></article>`).join('');const methods={};payments.forEach(p=>methods[p.payment_method]=(methods[p.payment_method]||0)+Number(p.amount));completed.filter(o=>o.order_source!=='pos'||!payments.some(p=>p.order_id===o.id)).forEach(o=>methods[o.payment_method]=(methods[o.payment_method]||0)+Number(o.total));document.getElementById('payment-report').innerHTML=Object.entries(methods).map(([k,v])=>row(labels[k]||k,money(v),sales?Math.round(v/sales*100):0)).join('')||empty();const products={};orders.filter(o=>o.status!=='cancelado').forEach(o=>o.items.forEach(i=>{const key=i.nombre;products[key]=(products[key]||0)+Number(i.qty)}));document.getElementById('product-report').innerHTML=Object.entries(products).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v],_,a)=>row(k,`${v} unidades`,a[0]?.[1]?Math.round(v/a[0][1]*100):0)).join('')||empty();const waiters={};completed.forEach(o=>{const key=o.waiter_name||'Venta en línea';if(!waiters[key])waiters[key]={orders:0,total:0};waiters[key].orders++;waiters[key].total+=Number(o.total)});document.getElementById('waiter-report').innerHTML=Object.entries(waiters).sort((a,b)=>b[1].total-a[1].total).map(([k,v])=>row(k,`${v.orders} · ${money(v.total)}`,sales?Math.round(v.total/sales*100):0)).join('')||empty();const differences=shifts.filter(s=>s.status==='closed').reduce((a,s)=>a+Number(s.difference||0),0);document.getElementById('control-report').innerHTML=`<div class="grid grid-cols-2 gap-3"><article class="p-4 bg-red-50 rounded-xl"><small class="font-black text-red-500">CANCELACIONES</small><b class="block text-2xl">${cancelled}</b></article><article class="p-4 bg-amber-50 rounded-xl"><small class="font-black text-amber-600">DIFERENCIA DE CAJA</small><b class="block text-2xl">${money(differences)}</b></article><article class="p-4 bg-blue-50 rounded-xl"><small class="font-black text-blue-600">DESCUENTOS</small><b class="block text-2xl">${money(orders.reduce((a,o)=>a+Number(o.discount_total||0),0))}</b></article><article class="p-4 bg-purple-50 rounded-xl"><small class="font-black text-purple-600">TURNOS CERRADOS</small><b class="block text-2xl">${shifts.filter(s=>s.status==='closed').length}</b></article></div>`;}
function row(name,value,width){return `<div><div class="flex justify-between text-sm"><b>${esc(name)}</b><span>${value}</span></div><div class="h-2 bg-slate-100 rounded-full mt-2"><div class="h-full bg-orange-500 rounded-full" style="width:${Math.min(width,100)}%"></div></div></div>`}function empty(){return '<p class="text-slate-400">Sin información en este periodo.</p>'}
function renderDelivery(){const delivery=orders.filter(o=>o.service_type==='delivery'),delivered=delivery.filter(o=>o.delivery_status==='delivered'),avg=delivered.length?Math.round(delivered.reduce((sum,o)=>sum+(new Date(o.delivered_at)-new Date(o.created_at))/60000,0)/delivered.length):0;document.getElementById('delivery-report').innerHTML=`<div class="grid grid-cols-2 gap-3"><article class="p-4 bg-orange-50 rounded-xl"><small class="font-black text-orange-600">PEDIDOS</small><b class="block text-2xl">${delivery.length}</b></article><article class="p-4 bg-green-50 rounded-xl"><small class="font-black text-green-600">ENTREGADOS</small><b class="block text-2xl">${delivered.length}</b></article><article class="p-4 bg-blue-50 rounded-xl"><small class="font-black text-blue-600">TIEMPO PROMEDIO</small><b class="block text-2xl">${avg} min</b></article><article class="p-4 bg-red-50 rounded-xl"><small class="font-black text-red-600">INCIDENCIAS</small><b class="block text-2xl">${incidents.length}</b></article></div>`}
function exportCsv(){const rows=[['Pedido','Fecha','Mesero','Total','Pago','Estado','Servicio','Estado delivery'],...orders.map(o=>[o.id,new Date(o.created_at).toLocaleString('es-MX'),o.waiter_name||'',o.total,labels[o.payment_method]||o.payment_method,o.status,o.service_type||'',o.delivery_status||''])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=`reporte-${document.getElementById('date-from').value}-${document.getElementById('date-to').value}.csv`;a.click();URL.revokeObjectURL(a.href);}init();
</script></body></html>
