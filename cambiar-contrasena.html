<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Cambiar contraseña | ServeYourself</title><link rel="stylesheet" href="tailwind.generated.css"><link rel="stylesheet" href="styles.css"></head><body class="bg-slate-50 min-h-screen p-5"><main class="max-w-md mx-auto bg-white rounded-3xl border p-6"><h1 class="text-2xl font-black">Cambiar contraseña</h1><form id="password-form" class="space-y-4 mt-5"><label class="block">Contraseña actual<input id="current-password" type="password" autocomplete="current-password" required class="block w-full border rounded-xl p-3"></label><label class="block">Nueva contraseña<input id="new-password" type="password" autocomplete="new-password" minlength="8" required class="block w-full border rounded-xl p-3"></label><label class="block">Confirmar contraseña<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required class="block w-full border rounded-xl p-3"></label><p id="result" role="status" aria-live="polite"></p><button type="submit" class="w-full rounded-xl bg-orange-500 text-white p-3 font-bold">Guardar contraseña</button></form><p class="mt-4 text-sm text-slate-500">Al terminar puedes cerrar esta pestaña.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const form=document.getElementById('password-form'), result=document.getElementById('result');
form.onsubmit=async event=>{
 event.preventDefault();
 const button=form.querySelector('button'), password=document.getElementById('new-password').value;
 if(password!==document.getElementById('confirm-password').value){result.textContent='Las contraseñas nuevas deben coincidir.';return;}
 button.disabled=true;
 const isolated=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 try{
  const {data:{user},error:userError}=await window.serveYourself.supabase.auth.getUser();
  if(userError||!user?.email)throw new Error('Inicia sesión para cambiar tu contraseña.');
  const {data,error}=await isolated.auth.signInWithPassword({email:user.email,password:document.getElementById('current-password').value});
  if(error||data.user?.id!==user.id)throw new Error('La contraseña actual no es correcta.');
  const {error:updateError}=await isolated.auth.updateUser({password});
  if(updateError)throw updateError;
  form.reset();result.textContent='Contraseña actualizada correctamente. Puedes cerrar esta pestaña.';
 }catch(error){result.textContent=error.message;}
 finally{await isolated.auth.signOut({scope:'local'});button.disabled=false;}
};
</script></body></html>
