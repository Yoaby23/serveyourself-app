<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>Serveyouself</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="tailwind.generated.css"><link rel="stylesheet" href="styles.css"></head>
<body class="bg-slate-50 min-h-screen sy-has-bottom-nav"><header class="sy-page-header"><div><p>ServeYourself</p><h1>Cuenta</h1></div><div id="restaurant-nav" class="sy-restaurant-nav"></div></header>
<main class="sy-page-shell sy-account-shell"><section class="sy-settings-card"><h2 id="account-name">Tu cuenta</h2><p id="account-email"></p><p id="account-role"></p><p id="account-status" role="status" aria-live="polite">Verificando tu cuenta…</p></section>
<section class="sy-settings-card"><h2>Opciones de cuenta</h2><a id="account-profile" href="perfil.html">Perfil personal y contraseña</a><a id="account-orders" href="menu.html?section=pedidos" hidden>Mis pedidos</a><a id="account-explore" href="menu.html">Explorar restaurantes</a><a id="account-work" href="funciones.html" hidden>Volver a mi negocio</a><button type="button" data-sy-enable-notifications hidden onclick="window.serveYourself.enableWorkNotifications()">Activar notificaciones</button><button type="button" onclick="window.serveYourself.installApp()">Instalar aplicación</button></section>
<section class="sy-settings-card"><h2>Privacidad y sesión</h2><a href="privacidad.html">Aviso de privacidad</a><a href="terminos.html">Términos de uso</a><a href="eliminar-cuenta.html" class="sy-action-danger">Solicitar eliminación de cuenta</a><button type="button" class="sy-danger" onclick="window.serveYourself.signOut()">Cerrar sesión</button></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script><script src="app-config.js"></script><script src="app.js"></script><script>
const app=window.serveYourself;let accountUser=null;
async function init(){
 try{
  accountUser=await app.requireUser();if(!accountUser)return;
  const {data:profile,error}=await app.supabase.from('profiles').select('full_name,phone,address,role').eq('id',accountUser.id).single();if(error)throw error;
  const personalRequested=new URLSearchParams(window.location.search).get('mode')==='personal';
  const workAccess=personalRequested?await app.getRestaurantAccess().catch(()=>null):await app.getRestaurantAccess();
  const personal=personalRequested||!workAccess;
  const access=personal?null:workAccess;
  if(access)app.renderRestaurantNavigation(access);else app.renderPersonalNavigation();
  document.getElementById('account-profile').href='perfil.html?mode='+(personal?'personal':'work');
  document.getElementById('account-orders').hidden=!personal;
  document.getElementById('account-explore').hidden=personal;
  document.getElementById('account-work').hidden=!personal||!workAccess;
  if(workAccess)document.getElementById('account-work').href=app.restaurantHome(workAccess);
  document.getElementById('account-name').textContent=profile.full_name||'Tu cuenta';
  document.getElementById('account-email').textContent=accountUser.email||'';
  document.getElementById('account-role').textContent=access?({owner:'Propietario',waiter:'Mesero',cashier:'Caja',kitchen:'Cocina',manager:'Encargado',driver:'Repartidor'}[access.staff_role]||'Personal'):'Cuenta personal';
  document.getElementById('account-status').textContent='';

 }catch(error){document.getElementById('account-status').textContent='No se pudo cargar tu cuenta. Recarga para reintentar.';}
}
init();
</script></body></html>
