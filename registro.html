<!DOCTYPE html>
<html lang="es" data-auth-pending>
<head>
    <link rel="icon" href="logo.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>serveyourself | Registro</title>
    <link rel="stylesheet" href="tailwind.generated.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        html[data-auth-pending] body > :not(#auth-splash) { display: none !important; }
        #auth-splash { display: none; }
        html[data-auth-pending] #auth-splash { display: grid; position: fixed; inset: 0; place-items: center; background: #f8fafc; z-index: 1000; }
        .auth-splash-content { text-align: center; padding: 2rem; font-family: system-ui, sans-serif; }
        .auth-splash-content img { width: 100px; height: 100px; object-fit: contain; margin: 0 auto 1.25rem; }
        .auth-splash-content h1 { font-size: 1.75rem; font-weight: 900; color: #0f172a; letter-spacing: -.06em; }
        .auth-splash-content h1 span { color: #f97316; }
        .auth-splash-content p { margin-top: 1rem; color: #64748b; font-size: .9rem; }
        .auth-splash-spinner { width: 24px; height: 24px; margin: 1.25rem auto; border: 3px solid #fed7aa; border-top-color: #f97316; border-radius: 50%; animation: auth-spin .8s linear infinite; }
        #auth-retry[hidden] { display: none; }
        #auth-retry { margin-top: 1rem; border: 0; border-radius: 1rem; background: #c2410c; color: white; padding: .85rem 1.5rem; font-weight: 800; }
        @keyframes auth-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .auth-splash-spinner { animation: none; } }
    </style>
    <script>
        window.authStartup = (() => {
            let timer;
            function fail() {
                const message = document.getElementById('auth-startup-message');
                if (message) message.textContent = 'No se pudo verificar la sesión. Revisa tu conexión y reintenta.';
                const retry = document.getElementById('auth-retry');
                if (retry) retry.hidden = false;
            }
            timer = setTimeout(fail, 15000);
            return { fail, finish() { clearTimeout(timer); document.documentElement.removeAttribute('data-auth-pending'); }, redirect(url) { clearTimeout(timer); window.location.replace(url); } };
        })();
    </script>

</head>
<body class="bg-slate-50">
    <div id="auth-splash" role="status" aria-live="polite" aria-label="Verificando sesión">
        <div class="auth-splash-content">
            <img src="logo.png" alt="Logo de ServeYourself">
            <h1>serve<span>yourself</span></h1>
            <div class="auth-splash-spinner" aria-hidden="true"></div>
            <p id="auth-startup-message">Verificando tu sesión…</p>
            <button type="button" id="auth-retry" hidden onclick="location.reload()">Reintentar</button>
            <noscript><p>Activa JavaScript para abrir la aplicación.</p></noscript>
        </div>
    </div>

    <main class="max-w-md mx-auto p-6 min-h-screen flex flex-col justify-center">
        <div class="bg-white p-8 rounded-[3rem] shadow-xl border border-slate-100">
            <a href="index.html" class="text-orange-500 font-bold mb-6 inline-block hover:opacity-70 transition-all">← Regresar</a>
            <h2 id="form-title" class="text-3xl font-black mb-2 text-slate-900 tracking-tight">Registro</h2>
            <p id="form-subtitle" class="text-slate-500 mb-8 font-medium">Únete a la nueva forma de pedir comida.</p>

            <div id="social-register" class="space-y-3" role="group" aria-label="Opciones de registro social">
                <button type="button" data-provider="google" onclick="registerWithProvider('google', this)" class="w-full min-h-14 flex items-center justify-center gap-3 bg-white text-slate-800 font-bold px-5 py-4 rounded-2xl border border-slate-200 hover:border-slate-300 hover:bg-slate-50 active:scale-[0.98] transition-all">
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.91h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.42l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.39 13.87A6.02 6.02 0 0 1 6.07 12c0-.65.11-1.29.32-1.87V7.51H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.49l3.35-2.62Z"/><path fill="#EA4335" d="M12 6c1.47 0 2.79.51 3.83 1.5l2.87-2.87A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.96 5.51l3.35 2.62C7.18 7.76 9.39 6 12 6Z"/></svg>
                    <span>Registrarme con Google</span>
                </button>
            </div>
            <div id="register-divider" class="flex items-center gap-3 my-6" aria-hidden="true">
                <span class="h-px flex-1 bg-slate-200"></span>
                <span class="text-xs font-bold uppercase tracking-widest text-slate-400">o usa tu correo</span>
                <span class="h-px flex-1 bg-slate-200"></span>
            </div>

            <form id="ui-form" class="space-y-4">
                <input type="text" id="reg-name" placeholder="Nombre completo" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none focus:border-orange-500 focus:bg-white transition-all text-sm font-medium" required>
                <input type="tel" id="reg-phone" placeholder="WhatsApp / Teléfono" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none focus:border-orange-500 focus:bg-white transition-all text-sm font-medium" required>
                <input type="email" id="reg-email" placeholder="Correo electrónico" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none focus:border-orange-500 focus:bg-white transition-all text-sm font-medium" required>
                <input type="password" id="reg-password" autocomplete="new-password" placeholder="Contraseña segura (mínimo 8 caracteres)" minlength="8" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none focus:border-orange-500 focus:bg-white transition-all text-sm font-medium" required>

                <div id="biz-section" class="hidden space-y-4 pt-4 border-t border-slate-100 mt-4">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] px-1">Configuración del Local</p>
                    <input type="text" id="biz-name" placeholder="Nombre Comercial" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none focus:border-orange-500 text-sm font-medium">
                    <input type="text" id="biz-address" placeholder="Dirección del local" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none focus:border-orange-500 text-sm font-medium">

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[9px] font-black text-slate-400 ml-2 uppercase">Abre</label>
                            <input type="time" id="open-time" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none focus:border-orange-500 text-sm font-medium">
                        </div>
                        <div>
                            <label class="text-[9px] font-black text-slate-400 ml-2 uppercase">Cierra</label>
                            <input type="time" id="close-time" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none focus:border-orange-500 text-sm font-medium">
                        </div>
                    </div>
                    <input type="url" id="biz-logo" placeholder="URL de la Foto del Local" class="w-full p-4 bg-slate-50 rounded-2xl border border-slate-100 outline-none focus:border-orange-500 text-sm font-medium">
                </div>

                <button type="submit" id="btn-register" class="w-full bg-orange-500 text-white font-black py-5 rounded-[2rem] shadow-lg shadow-orange-200 mt-6 uppercase tracking-widest active:scale-95 transition-all">
                    COMENZAR AHORA
                </button>
            </form>
            <p class="mt-5 text-center text-[11px] leading-relaxed text-slate-400">Al continuar aceptas los <a class="font-bold text-slate-600 underline" href="terminos.html">Términos de uso</a> y confirmas que leíste el <a class="font-bold text-slate-600 underline" href="privacidad.html">Aviso de privacidad</a>.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
    <script src="app-config.js"></script>
    <script src="runtime.js"></script><script src="app.js"></script>
    <script>
        const _supabase = window.serveYourself.supabase;

        const params = new URLSearchParams(window.location.search);
        const requestedRole = params.get('role');
        const role = ['cliente', 'negocio'].includes(requestedRole) ? requestedRole : 'cliente';
        const requestedNextPage = ['unirse.html', 'repartidor.html'].includes(params.get('next')) ? params.get('next') : null;
        const isOAuthReturn = params.get('oauth') === '1';

        if (role === 'negocio') {
            document.getElementById('form-title').innerText = "Tu Restaurante";
            document.getElementById('biz-section').classList.remove('hidden');
            document.getElementById('biz-name').required = true;
            document.getElementById('biz-address').required = true;
        }

        function setProviderButtonsDisabled(disabled, activeButton = null) {
            document.querySelectorAll('[data-provider]').forEach(button => {
                button.disabled = disabled;
                button.classList.toggle('opacity-60', disabled && button !== activeButton);
            });
            if (activeButton) {
                activeButton.dataset.label ||= activeButton.querySelector('span').textContent;
                activeButton.querySelector('span').textContent = disabled ? 'CONECTANDO...' : activeButton.dataset.label;
            }
        }

        async function registerWithProvider(provider, button) {
            if (provider !== 'google') return;
            setProviderButtonsDisabled(true, button);

            const redirectUrl = new URL('registro.html', window.location.href);
            redirectUrl.searchParams.set('role', role);
            redirectUrl.searchParams.set('oauth', '1');
            if (requestedNextPage) redirectUrl.searchParams.set('next', requestedNextPage);

            const { error } = await _supabase.auth.signInWithOAuth({
                provider,
                options: { redirectTo: redirectUrl.toString() }
            });

            if (error) {
                alert('No fue posible continuar con el proveedor: ' + error.message);
                setProviderButtonsDisabled(false, button);
            }
        }

        async function completeOAuthRegistration() {

            try {
                const { data: { session }, error } = await _supabase.auth.getSession();
                if (error) throw error;
                if (!session?.user) {
                    if (isOAuthReturn) throw new Error('No se recibió una sesión válida del proveedor.');
                    window.authStartup.finish(); return;
                }
                const { data: { user }, error: userError } = await _supabase.auth.getUser();
                if (userError) throw userError;
                if (!user) { window.authStartup.finish(); return; }
                const profile = await window.serveYourself.getOrCreateProfile(user);

                if (role !== 'negocio' || profile.role === 'negocio') {
                    const destination = profile.role === 'negocio' ? 'admin.html' : window.serveYourself.restaurantHome(await window.serveYourself.getRestaurantAccess());
                    window.authStartup.redirect(requestedNextPage || destination);
                    return;
                }

                const metadata = session.user.user_metadata || {};
                document.getElementById('reg-name').value = metadata.full_name || metadata.name || '';
                document.getElementById('reg-email').value = session.user.email || '';
                document.getElementById('reg-email').required = false;
                document.getElementById('reg-email').classList.add('hidden');
                document.getElementById('reg-password').required = false;
                document.getElementById('reg-password').classList.add('hidden');
                document.getElementById('social-register').classList.add('hidden');
                document.getElementById('register-divider').classList.add('hidden');
                document.getElementById('form-title').textContent = 'Completa tu restaurante';
                document.getElementById('form-subtitle').textContent = 'Tu cuenta ya está conectada. Agrega los datos del negocio para terminar.';
                document.getElementById('btn-register').textContent = 'CREAR MI RESTAURANTE';
                document.getElementById('ui-form').dataset.oauth = 'true';
                window.authStartup.finish();
            } catch (error) {
                if (error.status === 401 || ['refresh_token_not_found','refresh_token_already_used','session_not_found','bad_jwt','user_not_found'].includes(error.code)) window.authStartup.finish();
                else { console.warn('No se pudo verificar el registro:', error.message); window.authStartup.fail(); }
            }
        }

        document.getElementById('ui-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-register');
            btn.innerText = "REGISTRANDO...";
            btn.disabled = true;

            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const profileData = {
                full_name: document.getElementById('reg-name').value.trim(),
                phone: document.getElementById('reg-phone').value.trim(),
                role,
                business_name: role === 'negocio' ? document.getElementById('biz-name').value.trim() : null,
                address: role === 'negocio' ? document.getElementById('biz-address').value.trim() : null,
                open_time: role === 'negocio' ? (document.getElementById('open-time').value || null) : null,
                close_time: role === 'negocio' ? (document.getElementById('close-time').value || null) : null,
                avatar_url: role === 'negocio' ? (document.getElementById('biz-logo').value || null) : null
            };

            try {
                if (e.currentTarget.dataset.oauth === 'true') {
                    const { data: { user }, error: userError } = await _supabase.auth.getUser();
                    if (userError || !user) throw userError || new Error('La sesión del proveedor terminó.');

                    const { error: profileError } = await _supabase.rpc('complete_business_registration', { p_profile: profileData });
                    if (profileError) throw profileError;

                    window.location.replace('admin.html');
                    return;
                }

                const { data: authData, error: authError } = await _supabase.auth.signUp({
                    email,
                    password,
                    options: { data: { ...profileData, terms_version: '2026-10-18', terms_accepted_at: new Date().toISOString() } }
                });
                if (authError) throw authError;

                if (authData.user && authData.session) {
                    window.location.href = requestedNextPage || ((role === 'negocio') ? 'admin.html' : 'menu.html');
                } else {
                    alert('Cuenta creada. Revisa tu correo para confirmar el registro y después inicia sesión.');
                    window.location.href = requestedNextPage ? `index.html?next=${encodeURIComponent(requestedNextPage)}` : 'index.html';
                }
            } catch (error) {
                alert("Error: " + error.message);
                btn.innerText = "COMENZAR AHORA";
                btn.disabled = false;
            }
        });
        completeOAuthRegistration();
    </script>
</body>
</html>
